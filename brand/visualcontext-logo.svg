      <path d="M866 502 L898 502"/>
      <!-- e -->
      <path d="M914 532 L968 532 C968 508 954 502 941 502 C924 502 914 514 914 532 C914 552 926 562 944 562 C956 562 964 556 968 550"/>
      <!-- x -->
      <path d="M984 502 L1036 562"/>
      <path d="M1036 502 L984 562"/>
      <!-- t -->
      <path d="M1062 478 L1062 548 C1062 558 1070 562 1080 562"/>
      <path d="M1046 502 L1078 502"/>
    </g>

    <!-- Synaptic Dendrites & Neural Extensions on Typography -->
    <g id="Typography_Dendrites" stroke="#00FF66" stroke-linecap="round" stroke-linejoin="round" fill="none">
      
      <!-- 'V' Left & Bottom Dendrites -->
      <path d="M296 476 L278 448 M285 459 L268 463" stroke-width="3.5"/>
      <path d="M312 514 L282 504 L265 490 M282 504 L264 514" stroke-width="3.5"/>
      <path d="M332 562 L310 582 L292 582 M310 582 L304 600" stroke-width="3.5"/>
