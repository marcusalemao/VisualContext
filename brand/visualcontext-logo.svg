      <circle cx="264" cy="514" r="3.5" fill="#00FF66"/>
      <circle cx="292" cy="582" r="4" fill="#00FF66"/>
      <circle cx="304" cy="600" r="3.5" fill="#00FF66"/>

      <!-- 'i' Crown Synapse -->
      <path d="M386 476 L396 452 L412 442 M396 452 L386 438 M396 452 L414 460" stroke-width="3.5"/>
      <circle cx="412" cy="442" r="4.5" fill="#00FF66"/>
      <circle cx="386" cy="438" r="3.5" fill="#00FF66"/>
      <circle cx="414" cy="460" r="4" fill="#00FF66"/>

