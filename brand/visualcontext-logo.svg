      <path d="M618 570 L612 598 L602 610" stroke-width="3.5"/>
      <path d="M618 570 L632 596 L644 606 M632 596 L648 588" stroke-width="3.5"/>
      <circle cx="578" cy="584" r="4" fill="#00FF66"/>
      <circle cx="602" cy="610" r="4.5" fill="#00FF66"/>
      <circle cx="644" cy="606" r="4.5" fill="#00FF66"/>
      <circle cx="648" cy="588" r="3.5" fill="#00FF66"/>

      <!-- 'C' Upper Crest Synapse -->
      <path d="M682 478 L704 452 L724 446 M704 452 L702 434 M704 452 L722 464" stroke-width="3.5"/>
      <circle cx="724" cy="446" r="5" fill="#00FF66"/>
      <circle cx="702" cy="434" r="4" fill="#00FF66"/>
      <circle cx="722" cy="464" r="4" fill="#00FF66"/>

      <!-- 'x' & 't' Right Terminal Neural Branches -->
      <path d="M984 502 L958 480 L936 472 M958 480 L972 464" stroke-width="3.5"/>
      <path d="M1036 562 L1056 588 L1076 594 M1056 588 L1052 608" stroke-width="4"/>
      <path d="M984 562 L968 586 L952 594 M968 586 L982 602 M984 562 L964 562" stroke-width="3.5"/>
      <path d="M1062 478 L1078 456 L1098 464 M1078 456 L1086 436 M1062 468 L1054 442" stroke-width="3.5"/>
      
      <circle cx="936" cy="472" r="4.5" fill="#00FF66"/>
      <circle cx="972" cy="464" r="5" fill="#00FF66"/>
      <circle cx="952" cy="594" r="5.5" fill="#00FF66"/>
      <circle cx="982" cy="602" r="4.5" fill="#00FF66"/>
      <circle cx="964" cy="562" r="4" fill="#00FF66"/>
      <circle cx="1076" cy="594" r="5.5" fill="#00FF66"/>
      <circle cx="1052" cy="608" r="5" fill="#00FF66"/>
      <circle cx="1098" cy="464" r="4.5" fill="#00FF66"/>
      <circle cx="1086" cy="436" r="4" fill="#00FF66"/>
      <circle cx="1054" cy="442" r="4" fill="#00FF66"/>
    </g>
  </g>

  <!-- Optional Subtitle Group (Toggle visibility in Figma Layers) -->
  <g id="Subtitle_Optional" opacity="0.65">
    <text x="600" y="662" text-anchor="middle" fill="#00FF66" font-family="'Inter', 'SF Pro Display', 'Roboto', sans-serif" font-size="26" font-weight="300" letter-spacing="6">cognitive prosthesis</text>
  </g>
</svg>
