      <!-- s -->
      <path d="M452 512 C452 498 408 498 408 515 C408 532 454 528 454 547 C454 565 406 565 406 549"/>
      <!-- u -->
      <path d="M474 502 L474 540 C474 556 486 562 500 562 C514 562 526 554 526 540 L526 502 L526 562"/>
      <!-- a -->
      <path d="M594 514 C584 498 546 498 546 532 C546 566 584 566 594 548"/>
      <path d="M594 502 L594 562"/>
      <!-- l (Central Neural Axon Column) -->
      <path d="M618 462 L618 566"/>
      <!-- C -->
      <path d="M706 492 C692 472 642 474 642 520 C642 566 692 568 706 548"/>
      <!-- o -->
      <ellipse cx="752" cy="532" rx="28" ry="30"/>
      <!-- n -->
      <path d="M800 562 L800 502"/>
      <path d="M800 522 C800 505 814 502 828 502 C842 502 852 510 852 526 L852 562"/>
      <!-- t -->
