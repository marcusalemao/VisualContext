<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<meta name="robots" content="noindex">
<title>VisualContext Manager</title>
<link rel="icon" href="/brand/visualcontext-icon-512.png">
<script src="/icons.js"></script>
<script src="/consent.js" defer></script>
<style>
:root{--bg:#07090c;--s1:#0d1217;--s2:#121a20;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--g:#00ff88;--g2:#8fdfb5;--gdim:rgba(0,255,136,.12);
--t:#e8f0ec;--m:#7f8c86;--red:#ff6b6b;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--r:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--t);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--g)}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 0 10px}
header img{height:40px;width:auto}
html,body{overflow-x:hidden}
header .sp{flex:1}
.badge{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--g);border:1.5px solid var(--g);border-radius:99px;padding:4px 10px;white-space:nowrap}
.badge.warn{color:#ffd166;border-color:#ffd166}
.icon{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:18px;color:var(--g)}
.icon:hover{border-color:var(--g)}
.icon.lbl{width:auto;padding:0 12px;display:flex;gap:7px;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--t)}.icon.lbl svg{color:var(--g)}
@media (max-width:360px){.icon.lbl{width:40px;padding:0;justify-content:center}.icon.lbl span{display:none}}

/* ask */
.ask{position:relative;margin:18px auto 0;max-width:760px}
.ask input{width:100%;background:var(--s1);border:2px solid var(--line2);border-radius:18px;padding:16px 18px 16px 50px;font-size:17px;outline:none}
.ask input:focus{border-color:var(--g)}
.ask .spark{position:absolute;left:18px;top:15px;color:var(--g);font-size:20px;pointer-events:none}
.scope{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--s2);border:1.5px solid var(--line2);border-radius:16px;overflow:hidden;z-index:20;display:none}
.scope.on{display:block}
.scope button{display:flex;width:100%;text-align:left;padding:13px 16px;gap:10px;border-bottom:1px solid var(--line)}
.scope button:last-child{border-bottom:0}
.scope button:hover,.scope button:focus{background:var(--gdim);outline:none}
.scope .q{color:var(--g)}
.scope .n{margin-left:auto;color:var(--m);font:12px var(--mono)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px auto 0;max-width:760px}
.chip{border:1.5px dashed rgba(0,255,136,.5);color:var(--g2);border-radius:99px;padding:7px 13px;font-size:13.5px}
.chip:hover{border-color:var(--g);color:var(--g)}

/* answer */
.answer{max-width:760px;margin:16px auto 0;border:2px solid var(--g);border-radius:var(--r);padding:16px 18px;background:var(--s1);display:none}
.answer.on{display:block}
.answer h3{font:600 11px var(--mono);letter-spacing:.08em;color:var(--g);text-transform:uppercase;margin-bottom:8px;display:flex;gap:8px}
.answer h3 button{margin-left:auto;color:var(--m)}
.answer p{white-space:pre-wrap}
.src{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.src button,.act{font-size:13px;border:1.5px solid var(--line2);border-radius:10px;padding:6px 10px;color:var(--g2)}
.src button:hover,.act:hover{border-color:var(--g)}
.acts{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
.act{color:var(--bg);background:var(--g);border-color:var(--g);font-weight:600;text-decoration:none}
.dots::after{content:"…";animation:d 1s steps(3) infinite}

/* bar */
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:26px 0 12px}
@media(max-width:700px){.bar .pills{flex:1 1 100%}.chips{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none;padding-bottom:2px}.chip{white-space:nowrap}}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.pill{white-space:nowrap;border-radius:99px;padding:7px 13px;background:var(--s2);border:1.5px solid var(--line);font-size:14px}
.pill b{font:600 12px var(--mono);color:var(--m);margin-left:5px}
.pill.on{background:var(--g);color:var(--bg);border-color:var(--g)}
.pill.on b{color:rgba(0,0,0,.6)}
.plan{display:flex;flex-direction:column;gap:3px;border:1.5px solid var(--g);border-radius:14px;padding:12px 14px;margin:0 0 10px;background:var(--gdim)}.plan.done{border-color:var(--line2);background:transparent}.plan b{font-size:15px}.plan span{font-size:13.5px}
.seg{display:flex;border:1.5px solid var(--line2);border-radius:11px;overflow:hidden}
.seg button{padding:6px 11px;font-size:13px;color:var(--m)}
.seg button.on{background:var(--s2);color:var(--g)}
.tools{display:flex;gap:8px;align-items:center}

/* layout */
.main{display:grid;gap:18px}
@media(min-width:920px){.main{grid-template-columns:minmax(360px,440px) 1fr;align-items:start}.detail{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}}
.list{min-width:0}
.grp{font:600 11px var(--mono);letter-spacing:.1em;color:var(--m);text-transform:uppercase;margin:18px 4px 8px}
.grp:first-child{margin-top:4px}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 12px;border-radius:12px;border:1.5px solid transparent}
.row:hover{background:var(--s1)}
.row.sel{border-color:var(--g);background:var(--s1)}
.row .tx{min-width:0;flex:1}
.row .t1{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;font-weight:600;line-height:1.3}
.row .t2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;color:var(--m);font-size:13.5px;margin-top:2px}
/* who took part, as circles side by side (Marcus, 09/11): you + the assistant, you + Bruno, you + the photo of the keys */
.stk{display:flex;flex:none;align-items:center}
.stk .av{width:44px!important;height:44px!important;border:2px solid var(--bg);margin-left:-14px;font-size:20px}
.stk .av:first-child{margin-left:0}
.stk .av:not(.sym){font-size:12px}
.stk.n3 .av{width:40px!important;height:40px!important;margin-left:-18px}
.av.sym{color:var(--g);font-size:22px;font-family:inherit;background:#0f1d17}
.av.cov{border-radius:10px;padding:0}.av.cov img{border-radius:9px}
.av.k{font-size:26px;font-family:inherit}
.row.mini{padding:3px 12px;gap:10px;align-items:center}
.row.mini .t1{font-weight:400;font-size:13.5px!important;color:var(--m);-webkit-line-clamp:1}
.row.mini .mi{width:22px;text-align:center;color:var(--m);font-size:13px;flex:none}
/* waiting for Gemini: a bar and a percentage, not three grey dots (Marcus, 09/11) */
.prog{display:grid;gap:8px;padding:4px 0}
.prog .pl{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.prog .pt{color:var(--t);font-size:14.5px}
.prog .pp{font:700 20px var(--mono);color:var(--g)}
.prog .pb{height:6px;border-radius:9px;background:var(--s2);overflow:hidden}
.prog .pb i{display:block;height:100%;width:0;background:var(--g);border-radius:9px;box-shadow:0 0 10px rgba(0,255,136,.6);transition:width .25s linear}
.ver{display:flex;justify-content:center;margin-top:28px}
.ver span{font:600 11px var(--mono);color:var(--m);border:1px solid var(--line2);border-radius:99px;padding:3px 10px}
.pill.off{opacity:.35;pointer-events:none}
.lnk{color:var(--g);text-decoration:underline;text-underline-offset:3px;display:inline-flex;gap:6px;align-items:center;font:inherit}.lnk .ic{width:16px;height:16px;vertical-align:0}
/* feedback (Marcus, 09/11): a thumb on everything the AI made, a floating button, one question about the views */
.rate{display:inline-flex;gap:4px;align-items:center;margin-top:8px;color:var(--m);font-size:12px}
.rate button{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--m);border:1px solid transparent}
.rate button:hover{color:var(--g)}.rate button.on{color:var(--g);border-color:var(--g)}
.rate .ic{width:18px;height:18px;vertical-align:0}
.rate input{background:var(--s1);border:1px solid var(--line2);border-radius:9px;color:var(--t);padding:6px 9px;font:inherit;font-size:13px;min-width:0;flex:1}
.faces{display:flex;justify-content:space-between;gap:4px;margin-top:14px}
.faces button{flex:1;display:grid;justify-items:center;gap:4px;padding:8px 2px;border-radius:12px;color:var(--m);border:1.5px solid transparent}
.faces button .ic{width:40px;height:40px;vertical-align:0}.faces button small{font-size:11px;line-height:1.2;text-align:center}
.faces button:hover,.faces button.on{color:var(--g)}.faces button.on{border-color:var(--g)}
.fab{position:fixed;right:16px;bottom:16px;z-index:40;display:flex;gap:7px;align-items:center;padding:10px 14px;border-radius:99px;background:var(--s1);border:1.5px solid var(--g);color:var(--g);font-weight:600;font-size:13.5px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.fab .ic{width:18px;height:18px;vertical-align:0}
.choice{display:grid;gap:10px;margin:12px 0}.choice button{display:flex;gap:12px;align-items:center;text-align:left;padding:14px;border:1.5px solid var(--line2);border-radius:14px}
.choice button:hover{border-color:var(--g)}.choice .ic{width:30px;height:30px;color:var(--g)}.choice small{display:block;color:var(--m);font-size:13px}
.row .when{color:var(--m);font:12px var(--mono);white-space:nowrap}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font:600 14px var(--mono);border:1.5px solid var(--line2);color:var(--g2);overflow:hidden;background:var(--s2)}
.av img{width:100%;height:100%;object-fit:cover}
.av.k{border-radius:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{border:1.5px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;background:var(--s1);display:flex;flex-direction:column;gap:8px;min-height:140px}
.card:hover,.card.sel{border-color:var(--g)}
.card .av{width:54px;height:54px}
.card .t1{font-weight:600}.card .t2{color:var(--m);font-size:13px}
.empty{color:var(--m);padding:24px 8px;text-align:center}
.dup{display:flex;gap:10px;align-items:center;border:1.5px dashed #ffd166;color:#ffd166;border-radius:12px;padding:10px 12px;margin-bottom:8px;width:100%;text-align:left;font-size:14px}

/* my day */
.day{border:1.5px solid var(--line2);border-radius:var(--r);padding:14px 16px;margin-bottom:6px;background:linear-gradient(180deg,rgba(0,255,136,.06),transparent)}
.day h4{font:600 11px var(--mono);letter-spacing:.1em;color:var(--g);text-transform:uppercase}
.day p{margin:6px 0 8px}
.day .stops{display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--g2)}
.day .stops span{font-family:var(--mono);color:var(--m);margin-right:6px}
.day .stop{display:flex;gap:8px;align-items:flex-start;margin-top:4px}.day .stop>span{flex:0 0 auto;padding-top:2px}.day .stopb{min-width:0;flex:1}
.day .who{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}.day .whoa{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:99px;background:var(--s2);border:1px solid var(--line);font-size:13px;color:var(--g1)}
.day .whom{display:flex;align-items:center;gap:10px;margin-top:6px}.day .whom .names{font-size:13.5px;color:var(--m)}.day .whom .stk .av{width:36px!important;height:36px!important;margin-left:-10px;font-size:16px}.day .whom .stk .av:first-child{margin-left:0}.day .stopn{font-size:16px;font-weight:600;color:var(--g0,#fff)}
.day .how{font-family:var(--mono);font-size:12px;color:var(--m);padding:6px 0 2px 14px;border-left:2px dashed var(--line);margin:2px 0 2px 28px}
.row>.av{width:56px;height:56px}.row .t1{font-size:16px}
.day .foot{display:flex;justify-content:space-between;margin-top:10px;font:12px var(--mono);color:var(--m)}
.day .foot button{color:var(--g)}

/* detail (HUD card format) */
.detail{border:2px solid var(--g);border-radius:18px;background:var(--s1);padding:20px;min-height:200px}
.detail .ph{display:flex;gap:14px;align-items:center}
.detail .ph .av{width:72px;height:72px;font-size:20px}
.detail h2{font-size:22px;line-height:1.2}
.hook{color:var(--g2);font-size:14px;margin-top:3px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tag{font:12px var(--mono);border:1.5px solid var(--line2);border-radius:8px;padding:3px 8px;color:var(--g2)}
.sec{margin-top:20px}
.sec h5{font:600 11px var(--mono);letter-spacing:.1em;color:var(--m);text-transform:uppercase;border-bottom:1.5px solid var(--line);padding-bottom:6px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14.5px}
.kv dt{color:var(--m)}
.kv dd{word-break:break-word}
.enc{border-left:2px solid var(--g);padding:2px 0 2px 12px;margin-bottom:14px}
.enc .d{font:12px var(--mono);color:var(--m)}
.enc ul{margin:6px 0 0 18px;color:var(--g2);font-size:14px}
.trans{font-size:13.5px;color:var(--m);white-space:pre-wrap;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.btn{border:1.5px solid var(--line2);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;text-decoration:none;display:inline-flex;align-items:center}
.btn:hover{border-color:var(--g)}
.btn.pri{background:var(--g);color:var(--bg);border-color:var(--g)}
.btn.on{border-color:var(--g);color:var(--g);gap:10px}.btn .minus{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--g);font-size:16px;line-height:1}
/* Meu uso */
.gauge{display:grid;place-items:center;margin:8px 0 4px}.gauge b{display:block;text-align:center;font:700 26px var(--mono);color:var(--t)}.gauge small{display:block;text-align:center;color:var(--m);font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.feat{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 0;border-bottom:1px solid var(--line)}.feat:last-child{border-bottom:0}
.feat b{font-size:15px}.feat .n{font:600 13px var(--mono);color:var(--g);align-self:center}.feat .n.no{color:var(--m)}
.feat .hint{grid-column:1/-1;color:var(--m);font-size:13px}.feat .bar{grid-column:1/-1;height:4px;border-radius:9px;background:var(--s2);overflow:hidden;margin-top:4px}.feat .bar i{display:block;height:100%;background:var(--g)}
.btn.dan{color:var(--red);border-color:rgba(255,107,107,.4)}
.btn.dan:hover{border-color:var(--red)}
.back{display:none;color:var(--g);margin-bottom:12px;font-weight:600}
@media(max-width:919px){
  .detail{display:none;position:fixed;inset:0;z-index:30;border-radius:0;border:0;overflow:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
  .detail.open{display:block}.back{display:inline-block}.detail.idle{display:none!important}
}
@media(min-width:920px){.detail.idle{display:grid;place-items:center;color:var(--m);border-color:var(--line);border-style:dashed}}

/* forms & sheets */
.f{display:grid;gap:12px;margin-top:14px}
.f label{display:grid;gap:5px;font-size:13px;color:var(--m)}
.f input,.f textarea,.f select{background:var(--bg);border:1.5px solid var(--line2);border-radius:11px;padding:11px 12px;font-size:15px;color:var(--t);outline:none;width:100%}
.f input:focus,.f textarea:focus{border-color:var(--g)}
.f textarea{min-height:90px;resize:vertical}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .box{background:var(--s1);border:1.5px solid var(--line2);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:620px;max-height:92vh;overflow:auto;padding:20px 18px calc(22px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{align-items:center}.sheet .box{border-radius:20px;border-bottom:1.5px solid var(--line2)}}
.sheet h3{font-size:19px;margin-bottom:6px}
.sheet .sub{color:var(--m);font-size:14px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line2);border-radius:14px;padding:14px;margin-top:10px}
.opt:hover{border-color:var(--g)}
.opt .ic{font-size:22px;width:30px;text-align:center}
.opt small{display:block;color:var(--m)}
.pv{margin-top:14px;max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
.pv label{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
.pv label:last-child{border-bottom:0}
.pv input{accent-color:var(--g);width:18px;height:18px}
.pv .st{margin-left:auto;font:11px var(--mono);color:var(--m);white-space:nowrap}
.pv .st.new{color:var(--g)}
.pick{max-height:40vh;overflow:auto;margin-top:10px}
.chat{display:flex;flex-direction:column;gap:6px}.chat .msg{max-width:88%;padding:8px 12px;border-radius:14px;font-size:15px;line-height:1.4}
.chat .me{align-self:flex-end;background:#0f2a1c;border:1px solid #1f6b44;color:var(--t)}.chat .ai{align-self:flex-start;background:var(--s2);border:1px solid var(--line);color:var(--t)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--g);color:var(--bg);font-weight:600;padding:10px 16px;border-radius:12px;z-index:60;display:none;max-width:90vw}
.toast.on{display:block}
.gate{max-width:460px;margin:12vh auto 0;text-align:center}
.gate img{height:44px;margin-bottom:28px}
.gate h1{font-size:22px;margin-bottom:10px}
.gate p{color:var(--m)}
.gate .steps{text-align:left;border:1.5px solid var(--line2);border-radius:var(--r);padding:16px 18px;margin:22px 0;display:grid;gap:8px}
.gate .steps b{color:var(--g);font-family:var(--mono);margin-right:8px}
.muted{color:var(--m)}
.hide{display:none!important}
@keyframes d{0%{content:""}33%{content:"."}66%{content:".."}100%{content:"…"}}
</style>
</head>
<body>
<div id="gate" class="wrap hide">
  <div class="gate">
    <img src="/brand/visualcontext-logo-transparent.png" alt="VisualContext">
    <h1>Entrar no Manager</h1>
    <p>Use o e-mail da sua conta. Mandamos um código de 6 números; não precisa de senha.</p>
    <form class="f" id="lf" style="text-align:left;margin-top:18px">
      <input name="e" type="email" autocomplete="email" placeholder="seu@email.com" required>
      <input name="c" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="código de 6 números" class="hide">
      <div class="btns" style="margin-top:0"><button class="btn pri" id="lb">Enviar código</button></div>
      <p class="muted" id="lm" style="font-size:13px;min-height:1.2em"></p>
    </form>
    <p class="muted" style="font-size:13px">Ou abra pelo app do celular: Ajustes → Abrir o Manager.<br><button id="gTok" style="color:var(--m);text-decoration:underline;margin-top:10px">Tenho um código de aparelho</button></p>
  </div>
</div>

<div id="app" class="wrap hide">
  <header>
    <img src="/brand/visualcontext-logo-transparent.png" alt="VisualContext">
    <span class="sp"></span>
    <span id="plan" class="badge"></span>
    <button class="icon lbl" id="bImport" title="Importar pessoas e contatos" aria-label="Importar pessoas e contatos"><svg viewBox="0 -960 960 960" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M480-320 280-520l56-58 104 104v-326h80v326l104-104 56 58-200 200ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z"/></svg><span>Importar</span></button>

<script>
"use strict";
const API = "https://vzqjwhlpwvqrosoiwiin.supabase.co/functions/v1/vc";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v) } catch {} } };
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();

let LINK = null;
/* ---------- login: the app opens /manager#t=TOKEN&g=GEMINI_KEY; the fragment never reaches a server ---------- */
(function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("t") && /^vc_[A-Za-z0-9]{16,128}$/.test(h.get("t"))) store.set("vc_token", h.get("t"));
  if (h.get("g") && h.get("g").length > 20) store.set("vc_gemini", h.get("g"));
  // The sign-in e-mail's link comes back here with a Supabase session (#access_token=…) or an error.
  if (h.get("access_token")) LINK = { at: h.get("access_token"), app: new URLSearchParams(location.search).get("app") === "1" };
  else if (h.get("error_description")) LINK = { err: h.get("error_description") };
  if (h.get("p")) { try { sessionStorage.setItem("vc_open", h.get("p") + (h.get("prep") ? "|prep" : "")) } catch {} }
  if (location.hash || location.search.includes("app=")) history.replaceState(null, "", location.pathname);
})();
let TOKEN = store.get("vc_token");

async function call(action, extra = {}) {
  const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json", "x-vc-token": TOKEN }, body: JSON.stringify({ action, ...extra }) });
  if (r.status === 401) { store.set("vc_token", null); TOKEN = null; showGate(); throw new Error("token"); }
  const j = await r.json();
  if (!r.ok) throw new Error(j.detail || j.error || r.status);
  return j;
}
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove("on"), 2600); }

/* ---------- data ---------- */
const S = { me: null, people: [], enc: [], things: [], notes: [], cat: "all", view: store.get("vc_view_pref") || "teia", order: "new", sel: null, filter: null, dayOnly: false, face: "all", pick: null };
async function load() {
  S.myPlaces = await call("places").catch(() => []);
  const [me, people, enc, things, notes] = await Promise.all([call("me"), call("list", { entity: "person", thumbs: true }), call("list", { entity: "encounter" }), call("list", { entity: "thing" }), call("list", { entity: "note" })]);
  Object.assign(S, { me, people, enc, things, notes });
  render();
  refreshTopics();
  $("#fabic").innerHTML = I("rate_review");
  let o = null; try { o = sessionStorage.getItem("vc_open"); sessionStorage.removeItem("vc_open") } catch {}
  if (o) { const [pid, what] = o.split("|"); if (S.people.some(p => p.id === pid)) { open("person", pid); if (what === "prep") prep(pid); } }
}

const fmtWhen = d => {
  if (!d) return "";
  const t = new Date(d), now = new Date(), diff = (now - t) / 6e4;
  if (diff < 60) return Math.max(1, Math.round(diff)) + " min";
  if (sameDay(t, now)) return t.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  const y = new Date(now); y.setDate(y.getDate() - 1);
  if (sameDay(t, y)) return "ontem";
  return t.toLocaleDateString("pt-BR", { day: "2-digit", month: "short", ...(t.getFullYear() !== now.getFullYear() ? { year: "numeric" } : {}) }).replace(".", "");
};
const fmtFull = d => d ? new Date(d).toLocaleString("pt-BR", { weekday: "short", day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const initials = n => String(n || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const photo = p => p && p.photo_url && !/ui-avatars\.com/.test(p.photo_url) ? p.photo_url : p && p.thumb ? "data:image/jpeg;base64," + p.thumb : null;
const avatar = (p, cls = "") => { const u = photo(p); return `<span class="av ${cls}">${u ? `<img src="${esc(u)}" alt="" loading="lazy" onerror="this.remove()">` : esc(initials(p.name))}</span>`; };
/** You, as a circle: the photo of the person marked "Sou eu", or your initials. */
const meAv = () => { const p = S.people.find(x => isMe(x.name)); return p ? avatar(p) : `<span class="av">${esc(initials((S.me && S.me.me_name) || "Eu"))}</span>`; };
const sym = (c, title = "") => `<span class="av sym" title="${esc(title)}">${I(c) || esc(c)}</span>`;
/** An icon in a rounded square (lists, detail headers). */
const icAv = (n, style = "") => `<span class="av k" ${style ? `style="${style}"` : ""}>${I(n) || esc(n)}</span>`;
const imgAv = u => `<span class="av"><img src="${esc(u)}" alt="" loading="lazy" onerror="this.remove()"></span>`;
/** Who took part, side by side; past three they overlap more (Marcus, 09/11). */
const stack = parts => `<span class="stk ${parts.length > 2 ? "n3" : ""}">${parts.join("")}</span>`;

/* ---------- topics (Marcus, 09/11): a conversation's title starts with its subject ("Gastos a pagar"), never
   "O usuário pediu para…"; a talk that was only about a song folds into the song; a plain look-up (agenda, time)
   is not a memory and becomes a small line. Gemini names them once; the names stay in this browser. ---------- */
const TOP = (() => { try { return JSON.parse(store.get("vc_topics") || "{}") } catch { return {} } })();
const userLines = e => String(e.transcript || "").split("\n").filter(l => /^Você:/.test(l)).map(l => l.replace(/^Você:\s*/, "").trim());
const cap = t => t ? t[0].toUpperCase() + t.slice(1) : t;
function cleanSaid(t) {
  t = String(t || "").trim().replace(/\.$/, "");
  t = t.replace(/^(o|a) usu[aá]ri[oa]\s+(pediu|perguntou|quis saber|tentou|solicitou|queria|identificou|disse|falou|comentou|mencionou|buscou|procurou)\s+(para\s+|ao assistente\s+(para\s+|sobre\s+|se\s+)?|sobre\s+|se\s+|que\s+|a\s+|o\s+|qual\s+|quais\s+|onde\s+)?/iu, "");
  t = t.replace(/^(você|vc)\s+(pediu|perguntou)\s+(para\s+|sobre\s+|se\s+)?/iu, "");
  return cap(t);
}
function guessKind(e) {
  const u = userLines(e); if (!u.length) return "outro";
  const music = /m[uú]sica|letra|tocando|toca |spotify|cantor|banda|essa can[cç][aã]o/i, look = /(o que|que) .*(tenho|tem)|agenda|compromisso|que horas|amanh[aã]|para fazer|meu dia/i;
  if (u.every(l => music.test(l) || l.split(/\s+/).length < 4)) return "musica";
  if (u.every(l => look.test(l) || l.split(/\s+/).length < 4)) return "consulta";
  return "outro";
}
const topicOf = e => TOP[e.id] || { t: cleanSaid(said(e)) || "Conversa com o assistente", k: guessKind(e) };
const dayPt = d => new Date(d).toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit" }).replace(".", "");
async function refreshTopics() {
  const key = store.get("vc_gemini"); if (!key) return;
  const todo = S.enc.filter(e => e.capture_mode === "live" && !TOP[e.id] && e.transcript).slice(0, 30);
  if (!todo.length) return;
  const items = todo.map(e => ({ id: e.id, quando: new Date(e.at).toLocaleString("pt-BR", { weekday: "long", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }), conversa: String(e.transcript).slice(0, 900) }));
  const prompt = `Para cada conversa do usuário com o assistente dos óculos, dê um título e um tipo. Responda em JSON: [{"id": string, "titulo": string, "tipo": "musica"|"consulta"|"outro"}].
Título: até 6 palavras, começando pelo assunto ("Gastos a pagar até sexta", "Onde deixei a moto", "Calorias do prato do Bruno"). Nunca "O usuário…", "Você pediu…" nem verbo de pedir. Datas relativas (hoje, amanhã, sexta) viram a data real a partir de "quando" ("Agenda de seg 09/11").
Tipo: "musica" se a conversa foi só para identificar, tocar ou ver a letra de música; "consulta" se ele só consultou agenda, tarefas, hora ou clima e nada novo foi dito ou decidido; senão "outro".
CONVERSAS: ${JSON.stringify(items)}`;
  try {
    const j = await gemini(key, { contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.1, maxOutputTokens: 4096, responseMimeType: "application/json" } });
    const txt = (j.candidates?.[0]?.content?.parts || []).filter(p => !p.thought && p.text).map(p => p.text).join("");
    for (const r of JSON.parse(txt.replace(/^```json|```$/g, ""))) if (r.id && r.titulo) TOP[r.id] = { t: cleanSaid(r.titulo), k: ["musica", "consulta"].includes(r.tipo) ? r.tipo : "outro" };
    store.set("vc_topics", JSON.stringify(TOP)); render();
  } catch {}
}

/* ---------- album covers (iTunes search, free, no key; JSONP because it sends no CORS header) ---------- */
const COV = (() => { try { return JSON.parse(store.get("vc_cov") || "{}") } catch { return {} } })();
function coverFor(t, a, cb) {
  const k = norm(t + " " + a); if (k in COV) return cb(COV[k]);
  const fn = "vcCov" + Math.random().toString(36).slice(2), sc = document.createElement("script");
  const end = u => { COV[k] = u; store.set("vc_cov", JSON.stringify(COV)); delete window[fn]; sc.remove(); cb(u); };
  window[fn] = j => end(j?.results?.[0]?.artworkUrl100?.replace("100x100bb", "300x300bb") || "");
  sc.onerror = () => { delete window[fn]; sc.remove(); cb(""); };
  sc.src = `https://itunes.apple.com/search?media=music&entity=song&limit=1&callback=${fn}&term=${encodeURIComponent(a + " " + t)}`;
  document.head.appendChild(sc);
}
function hydrateCovers(root = document) {
  root.querySelectorAll("[data-cover]").forEach(el => { const [t, a] = el.dataset.cover.split("\u0001"); el.removeAttribute("data-cover"); coverFor(t, a, u => { if (u) el.innerHTML = `<img src="${esc(u)}" alt="">`; }); });
}
const coverAv = (r, big) => { const s = songOf(r); return `<span class="av k cov" ${big ? 'style="width:96px;height:96px"' : ""} data-cover="${esc(s.title + "\u0001" + s.artist)}">${I("music_note")}</span>`; };

/** Conversations that were only about a song, and the song note each belongs to (identified within 15 min). */
function musicChats() {
  const m = new Map();
  for (const e of S.enc) {
    if (e.capture_mode !== "live" || topicOf(e).k !== "musica") continue;
    const t = new Date(e.at).getTime();
    const n = S.notes.find(n => n.kind === "musica" && Math.abs(new Date(n.at) - t) < 15 * 6e4);
    if (n) m.set(e.id, n.id);
  }
  return m;
}
/** Everything as one catalog: people, places, things, memories (moments and notes). */
function items() {
  const out = [];
  for (const p of S.people) out.push({ kind: "person", id: p.id, title: isMe(p.name) ? p.name + " ★ você" : p.name, sub: isMe(p.name) ? "você mesmo · nunca vira encontro" : [p.relation, p.company, p.role].filter(Boolean).join(" · ") || (p.faces ? "rosto guardado" : "sem rosto ainda"), date: p.last_seen_date || p.created_at, ref: p, av: avatar(p) });
  const folded = musicChats();
  for (const e of S.enc) {
    const live = e.capture_mode === "live";
    if (folded.has(e.id)) continue; // only about a song: it lives inside the song's card
    const p = e.person_name && !isMe(e.person_name) ? S.people.find(x => nameKey(x.name) === nameKey(e.person_name)) : null;
    if (live) {
      const tp = topicOf(e);
      out.push({ kind: "memory", id: e.id, title: tp.t, sub: placeName(e) || "", date: e.at, ref: e, sub2: "enc", mini: tp.k === "consulta",
        av: stack([meAv(), sym(tp.k === "musica" ? "music_off" : "auto_awesome", tp.k === "musica" ? "música não reconhecida" : "assistente"), ...(p ? [avatar(p)] : [])]) });
      continue;
    }
    const what = said(e);
    out.push({ kind: "memory", id: e.id, title: isMe(e.person_name) ? "Você mesmo (teste ou espelho)" : e.person_name ? e.person_name : (e.context || "Momento"), sub: [what, placeName(e)].filter(Boolean).join(" · "), date: e.at, ref: e, sub2: "enc",
      av: stack([meAv(), p && photo(p) ? avatar(p) : e.person_name ? sym("handshake", e.person_name) : sym("help", "não sei o que é")]) });
  }
  const PK = { pix: ["qr_code", "Pix"], link: ["link", "link"], cartao: ["contact_page", "cartão de visita"], cracha: ["badge", "crachá"], receita: ["medication", "receita"], formulario: ["list_alt", "formulário"], cardapio: ["restaurant_menu", "cardápio"], musica: ["music_note", "música"], ouvir_depois: ["playlist_add_check", "ouvir depois"], traducao: ["translate", "tradução"], evento: ["calendar_month", "compromisso"], outro: ["description", "papel"] };
  // To-dos (Marcus, 09/11): their own category; done ones (a "tarefa_feita" note points to them) and the "feita" markers stay out.
  const doneT = tasksDone();
  for (const n of S.notes) if (n.kind === "tarefa" && !doneT.has(n.id)) { const f = n.fields || {}; out.push({ kind: "task", id: n.id, title: n.title || n.text, sub: [TACT[f.acao]?.[1], f.pessoa, f.quando && "até " + fmtShort(f.quando)].filter(Boolean).join(" · ") || "tarefa", date: f.quando || n.at, ref: n, av: icAv(TACT[f.acao]?.[0] || "check") }); }
  for (const n of S.notes) {
    if (["tarefa", "tarefa_feita", "ligacao"].includes(n.kind)) continue;
    const k = PK[n.kind];
    if (n.kind === "musica" || n.kind === "ouvir_depois") { const sg = songOf(n); out.push({ kind: "memory", id: n.id, title: sg.title || n.title, sub: [n.kind === "ouvir_depois" ? "ouvir depois" : "", sg.artist, n.place].filter(Boolean).join(" · "), date: n.at, ref: n, sub2: "note", av: coverAv(n) }); continue; }
    out.push({ kind: "memory", id: n.id, title: n.title || n.text, sub: k ? k[1] + (n.place ? " · " + n.place : "") : "nota" + (n.source === "voice" ? " por voz" : ""), date: n.at, ref: n, sub2: "note", av: stack([meAv(), sym(k ? k[0] : "edit_note")]) });
  }
  for (const t of S.things) out.push({ kind: "thing", id: t.id, title: t.name, sub: t.location_description || "", date: t.seen_at, ref: t, av: stack([meAv(), t.snapshot_url ? imgAv(t.snapshot_url) : sym(/chave/i.test(t.name) ? "key" : "category")]) });
  const places = new Map();
  const addPlace = (name, date, lat, lng) => { if (!name) return; const k = norm(name); const p = places.get(k) || { name, n: 0, date: null, lat, lng }; p.n++; if (!p.date || date > p.date) p.date = date; if (lat && !p.lat) { p.lat = lat; p.lng = lng; } places.set(k, p); };
  S.enc.forEach(e => { const m = myPlaceAt(e.lat, e.lng); addPlace(m ? m.name : e.place, e.at, m ? m.lat : e.lat, m ? m.lng : e.lng); });
  for (const [k, p] of places) { const mp = (S.myPlaces || []).find(x => norm(x.name) === k); out.push({ kind: "place", id: "pl:" + k, title: p.name, sub: (mp ? ({ casa: "sua casa", trabalho: "seu trabalho" }[mp.kind] || "seu lugar") + " · " : "") + p.n + (p.n === 1 ? " momento" : " momentos"), date: p.date, ref: p, av: icAv(mp ? ({ casa: "home", trabalho: "work" }[mp.kind] || "star") : "location_on") }); }

/**
 * A Brazilian number as WhatsApp wants it, 55 + DDD + number (Marcus, 09/11: "11977880888" went to +55 19 7788-0888).
 * Drops 00/0/carrier prefixes, adds 55 to a DDD + number, and the 9 to an old 8-digit mobile. Anything else (abroad,
 * no DDD) goes as typed — better than guessing.
 */
function brPhone(raw) {
  let d = String(raw || "").replace(/\D/g, "");
  if (!d) return "";
  d = d.replace(/^00/, "");
  if (/^0\d{12,13}$/.test(d)) d = d.slice(3);        // 0 + carrier (2) + DDD + number
  else if (/^0\d{10,11}$/.test(d)) d = d.slice(1);   // 0 + DDD + number
  if (/^55\d{10,11}$/.test(d)) d = d.slice(2);
  if (!/^\d{10,11}$/.test(d)) return d;
  const ddd = d.slice(0, 2); let n = d.slice(2);
  if (n.length === 8 && /^[6-9]/.test(n)) n = "9" + n;
  return "55" + ddd + n;
}
/** Opens the WhatsApp app itself on Android (wa.me opened the web version), the site elsewhere. */
function waHref(num, text = "") {
  const n = brPhone(num), web = "https://wa.me/" + n + (text ? "?text=" + encodeURIComponent(text) : "");
  return /Android/i.test(navigator.userAgent) ? `intent://send?phone=${n}${text ? "&text=" + encodeURIComponent(text) : ""}#Intent;scheme=whatsapp;package=com.whatsapp;S.browser_fallback_url=${encodeURIComponent(web)};end` : web;
}

function csvRows(text) {
  const out = [], sep = (text.split("\n").find(l => l.trim()) || "").split(";").length > (text.split("\n").find(l => l.trim()) || "").split(",").length ? ";" : ",";
  let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true; else if (c === sep) { row.push(cell); cell = ""; } else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); out.push(row); row = []; cell = ""; } else cell += c;
  }
  if (cell || row.length) { row.push(cell); out.push(row); }
  return out.filter(r => r.some(x => x.trim()));
}
function parseTable(text) {
  text = text.replace(/^﻿/, "");
  const rows = csvRows(text);
  const hi = rows.findIndex(r => r.some(c => /^(first name|nome|name|nome completo|full name)$/i.test(c.trim())));
  if (hi < 0) throw new Error("header");
  const H = rows[hi].map(h => norm(h)), col = (...names) => H.findIndex(h => names.includes(h));
  const iF = col("first name", "primeiro nome", "nome proprio"), iL = col("last name", "sobrenome", "ultimo nome"), iN = col("nome", "name", "nome completo", "full name");
  const iC = col("company", "empresa", "organizacao", "organization"), iR = col("position", "cargo", "title", "funcao", "role"), iE = col("email address", "email", "e mail"), iP = col("telefone", "phone", "celular", "phone number", "whatsapp"), iU = col("url", "linkedin", "profile url", "perfil");
  return rows.slice(hi + 1).map(r => {
    const g = i => i >= 0 ? (r[i] || "").trim() : "";
    const name = g(iN) || [g(iF), g(iL)].filter(Boolean).join(" ");
    const url = g(iU);
    return { name, company: g(iC), role: g(iR), contact_email: g(iE), contact_phone: g(iP), contact_linkedin: /linkedin\.com/.test(url) ? url : "", source: iF >= 0 && iU >= 0 ? "linkedin" : "planilha" };
  });
}
function parseVcf(text) {
  const lines = text.replace(/\r\n/g, "\n").replace(/\n[ \t]/g, "").split("\n"), out = []; let c = null;
  const val = l => l.slice(l.indexOf(":") + 1).replace(/\\,/g, ",").replace(/\\;/g, ";").replace(/\\n/gi, " ").trim();
  const qp = (l, v) => /QUOTED-PRINTABLE/i.test(l) ? decodeURIComponent(v.replace(/=\n?/g, "%").replace(/%([^0-9A-F]|$)/gi, "")) : v;
  for (const l of lines) {
    const k = l.split(/[:;]/)[0].toUpperCase().replace(/^ITEM\d+\./, "");
    if (k === "BEGIN") c = {}; else if (k === "END") { if (c) out.push(c); c = null; } else if (!c) continue;
    else if (k === "FN") c.name = qp(l, val(l));
    else if (k === "N" && !c.name) c.name = qp(l, val(l)).split(";").slice(0, 2).reverse().filter(Boolean).join(" ");
    else if (k === "ORG") c.company = val(l).split(";")[0];
    else if (k === "TITLE") c.role = val(l);
    else if (k === "TEL" && !c.contact_phone) c.contact_phone = val(l);
    else if (k === "EMAIL" && !c.contact_email) c.contact_email = val(l);
    else if (k === "URL" && /linkedin/i.test(l)) c.contact_linkedin = val(l);
  }
  return out.map(r => ({ ...r, source: "contatos" }));
}
