<style>
:root{--bg:#07090c;--s1:#0d1217;--s2:#121a20;--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.2);--g:#00ff88;--g2:#8fdfb5;--t:#e8f0ec;--m:#9aaaa2;--err:#ff8a8a;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--g)}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;min-height:64px}
header .logo img{height:40px;width:auto;display:block}
.lang{margin-left:auto;display:flex;gap:4px}
.lang button{min-height:36px;min-width:40px;border-radius:10px;border:1px solid var(--line2);background:var(--s1);color:var(--t);font:600 13px system-ui;cursor:pointer}
.lang button.on{border-color:var(--g);color:var(--g)}
.kicker{font:600 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--g);margin:0 0 12px}
h1{font-size:clamp(32px,5.4vw,52px);line-height:1.06;margin:0 0 16px;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--g)}
h2{font-size:clamp(22px,3vw,28px);line-height:1.2;margin:0 0 10px}
.lead{font-size:clamp(17px,2vw,20px);color:var(--g2);margin:0 0 22px;max-width:620px}
.top{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;padding:48px 16px 56px}
@media (max-width:820px){.top{grid-template-columns:1fr;gap:28px;padding-top:32px;padding-bottom:64px}}
.feats{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.feats li{display:flex;gap:12px;align-items:flex-start;color:var(--t)}
.feats .ic{color:var(--g);width:22px;height:22px;margin-top:2px}
/* the phone that becomes the glasses */
.phone{justify-self:center;width:min(270px,78vw);aspect-ratio:9/18;border-radius:34px;border:2px solid #1d4a33;background:#030806;padding:12px;position:relative}
.screen{position:absolute;inset:12px;border-radius:24px;overflow:hidden;background:radial-gradient(120% 80% at 35% 25%,#2d3b34 0%,#151d19 50%,#0a0f0c 100%)}
.screen{background:#151d19 url(/faces/ana-souza-scene.jpg) 50% 0/auto 100% no-repeat}
.screen::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.05) 40%,rgba(0,0,0,.45))}
.screen .box{position:absolute;left:24%;top:20%;width:52%;height:36%;border:2px solid var(--g);border-radius:12px}
.screen .tag{position:absolute;left:24%;top:13%;background:rgba(0,0,0,.75);color:var(--g);font:700 13px system-ui;padding:2px 8px;border-radius:6px}
.screen .card{position:absolute;left:7%;right:7%;bottom:16%;background:rgba(4,14,9,.9);border:2px solid var(--g);border-radius:12px;padding:8px 10px;font:11px/1.45 var(--mono);color:#cfeedd}
.screen .card b{display:block;font:700 14px system-ui;color:var(--g)}
.screen .mic{position:absolute;left:10px;top:10px;color:var(--g)}
.screen .bar{position:absolute;left:0;right:0;bottom:0;height:11%;background:rgba(0,0,0,.7);display:flex;justify-content:space-around;align-items:center;color:var(--g);font:600 10px system-ui}
.phone .cap{position:absolute;bottom:-34px;left:0;right:0;text-align:center;color:var(--m);font-size:13px}
section{padding:40px 0;border-top:1px solid var(--line)}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
@media (max-width:820px){.how{grid-template-columns:1fr}}
.how div{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.how b{display:block;color:var(--g);font:700 13px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.how p{margin:0;color:var(--t)}
.plan{list-style:none;padding:0;margin:20px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:12px;counter-reset:r}
@media (max-width:820px){.plan{grid-template-columns:1fr}}
.plan li{counter-increment:r;display:grid;align-content:start;grid-auto-rows:min-content;grid-template-columns:44px 1fr;gap:4px 12px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.plan li::before{content:counter(r);grid-row:1 / span 3;width:36px;height:36px;border-radius:50%;border:2px solid var(--g);color:var(--g);display:flex;align-items:center;justify-content:center;font:700 16px var(--mono)}
.plan b{color:var(--t);font-size:17px}
.plan p{margin:0;color:var(--g2)}
.plan .say{margin-top:6px;font:13px/1.5 var(--mono);color:var(--m)}
.g{color:var(--g)}
.tip{margin:18px 0 0;color:var(--m);font-size:15px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
@media (max-width:820px){.form{grid-template-columns:1fr}}
form{background:var(--s1);border:1px solid var(--line2);border-radius:18px;padding:22px 20px;display:grid;gap:14px}
label{display:grid;gap:6px;font-weight:600;font-size:15px}
label small{font-weight:400;color:var(--m)}
input,select,textarea{width:100%;min-height:48px;background:var(--bg);color:var(--t);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font:inherit}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g);outline-offset:1px;border-color:var(--g)}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.chk input{width:22px;min-height:22px;height:22px;accent-color:var(--g);margin:2px 0 0}
.hp{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}
button.send{min-height:52px;border-radius:14px;border:2px solid var(--g);background:var(--g);color:var(--bg);font:700 17px system-ui;cursor:pointer}
button.send:disabled{opacity:.6;cursor:wait}
.msg{margin:0;font-size:15px}.msg.err{color:var(--err)}
.done{display:none;background:var(--s1);border:2px solid var(--g);border-radius:18px;padding:24px 22px}
.done .ic{color:var(--g);width:34px;height:34px}
.done h2{margin-top:8px}
.note{color:var(--m);font-size:14px;margin:12px 0 0}
footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--m);font-size:14px}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="/"><img src="/brand/visualcontext-logo-transparent.png" alt="VisualContext"></a>
  <div class="lang" role="group" aria-label="Idioma / Language"><button type="button" data-l="pt">PT</button><button type="button" data-l="en">EN</button></div>
</div></header>

<main>
<div class="wrap top">
  <div>
    <p class="kicker" data-t="kicker"></p>
    <h1 data-t="h1"></h1>
    <p class="lead" data-t="lead"></p>
    <ul class="feats">
      <li><span data-i="person"></span><span data-t="f1"></span></li>
      <li><span data-i="edit_note"></span><span data-t="f2"></span></li>
      <li><span data-i="key"></span><span data-t="f3"></span></li>
      <li><span data-i="restaurant_menu"></span><span data-t="f4"></span></li>
      <li><span data-i="music_note"></span><span data-t="f5"></span></li>
    </ul>
  </div>
  <div class="phone" aria-hidden="true">
    <div class="screen">
      <span class="mic" data-i="auto_awesome"></span>
      <div class="box"></div><span class="tag">Ana</span>
      <div class="card"><b>Ana Souza</b><span data-t="mock"></span></div>
      <div class="bar"><span>Pessoas</span><span>Lugares</span><span>Escuta</span></div>
    </div>
    <p class="cap" data-t="cap"></p>
  </div>
</div>

<section><div class="wrap">
  <p class="kicker" data-t="k_how"></p>
  <h2 data-t="h_how"></h2>
  <div class="how">
    <div><b data-t="s1"></b><p data-t="s1p"></p></div>
    <div><b data-t="s2"></b><p data-t="s2p"></p></div>
    <div><b data-t="s3"></b><p data-t="s3p"></p></div>
  </div>
</div></section>


<section id="pedir"><div class="wrap form">
  <div>
    <p class="kicker" data-t="k_form"></p>
    <h2 data-t="h_form"></h2>
    <p data-t="p_form"></p>
    <p class="note" data-t="privacy"></p>
  </div>
  <div>
    <form id="f" novalidate>
      <label><span data-t="l_name"></span><input name="name" autocomplete="name" required maxlength="120"></label>
      <label><span data-t="l_email"></span><input name="email" type="email" autocomplete="email" required maxlength="200"></label>
      <label><span><span data-t="l_phone"></span> <small data-t="opt"></small></span><input name="phone" maxlength="80" data-ph="ph_phone"></label>
      <label><span data-t="l_glasses"></span>
        <select name="glasses"><option value="" data-t="g0"></option><option value="Rokid" data-t="g1"></option><option value="outros" data-t="g2"></option></select></label>
      <label class="chk"><input type="checkbox" name="android" required><span data-t="l_android"></span></label>
      <div class="hp" aria-hidden="true"><label>Site <input name="site" tabindex="-1" autocomplete="off"></label></div>
      <p class="msg err" id="err" role="alert" hidden></p>
      <button class="send" type="submit" data-t="send"></button>
    </form>
    <div class="done" id="done" role="status" tabindex="-1">
      <span data-i="check"></span>
      <h2 data-t="done_h"></h2>
      <p id="doneP"></p>
      <p class="note"><a href="/demo" data-t="done_demo"></a></p>
    </div>
  </div>
</div></section>
</main>

<footer><div class="wrap">VisualContext · <a href="https://alema.io">Alema</a> · São Paulo · <a href="/" data-t="home"></a></div></footer>

const qs = new URLSearchParams(location.search).get("lang"); if (qs === "pt" || qs === "en") L = qs;
function paint() {
  const t = T[L]; document.documentElement.lang = L === "pt" ? "pt-BR" : "en";
  document.querySelectorAll("[data-t]").forEach(el => { const v = t[el.dataset.t]; if (typeof v === "string") el.innerHTML = v.replace(/\n/g, "<br>"); });
  document.querySelectorAll("[data-ph]").forEach(el => el.placeholder = t[el.dataset.ph]);
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === L));
}
document.querySelectorAll("[data-i]").forEach(el => el.innerHTML = window.I ? I(el.dataset.i) : "");
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { L = b.dataset.l; try { localStorage.setItem("vc_lang", L); } catch (_) {} paint(); });
paint();

const f = document.getElementById("f"), err = document.getElementById("err");
f.addEventListener("submit", async e => {
  e.preventDefault();
  const t = T[L], d = Object.fromEntries(new FormData(f));
  const show = m => { err.textContent = m; err.hidden = false; };
  err.hidden = true;
  if (String(d.name || "").trim().length < 2 || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(d.email || "").trim())) return show(t.e_fields);
  if (!d.android) return show(t.e_android);
  const btn = f.querySelector(".send"); btn.disabled = true; btn.textContent = t.sending;
  try {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "beta_request", name: d.name, email: d.email, phone: d.phone, glasses: d.glasses, lang: L, site: d.site }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || t.e_net);
    const first = String(d.name).trim().split(/\s+/)[0];
    document.getElementById("doneP").textContent = (j.again ? t.done_again : t.done_p)(first);
    f.style.display = "none"; const done = document.getElementById("done"); done.style.display = "block"; done.focus();
  } catch (x) { show(x.message || t.e_net); btn.disabled = false; btn.textContent = t.send; }
});
</script>
<script src="/consent.js" defer></script>
</body>
