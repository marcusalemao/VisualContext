<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VisualContext</title>
<script src="i18n.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0e1a;color:#f0f4ff;font-family:-apple-system,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
h1{font-size:22px;font-weight:700;color:#00ff88;margin-bottom:6px}
.sub{font-size:13px;color:rgba(255,255,255,.4);margin-bottom:32px;text-align:center}
.cards{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px}
a{display:flex;align-items:center;gap:14px;padding:16px;background:#111827;
  border:1px solid rgba(255,255,255,.08);border-radius:14px;text-decoration:none;color:#f0f4ff}
a:active{opacity:.8}
.ic{font-size:26px;width:44px;text-align:center;flex-shrink:0}
.info h2{font-size:15px;font-weight:600}
.info p{font-size:12px;color:rgba(255,255,255,.4);margin:0}
a.primary{border-color:rgba(0,255,136,.25);background:rgba(0,255,136,.07)}
.lang{margin-top:28px;display:flex;gap:8px}
.lang button{background:none;border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.5);font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer}
.lang button.on{border-color:rgba(0,255,136,.5);color:#00ff88}
</style>
</head>
<body>
<h1>⬡ VisualContext</h1>
<p class="sub" data-i18n="pitch"></p>
<div class="cards">
  <a href="/webapp" class="primary">
    <div class="ic">👥</div>
    <div class="info"><h2>Manager</h2><p data-i18n="manager"></p></div>
  </a>
  <a href="/hud-editor">
    <div class="ic">🛠</div>
    <div class="info"><h2>HUD Editor</h2><p data-i18n="editor"></p></div>
  </a>
  <a href="/emulator-standalone">
    <div class="ic">📟</div>
    <div class="info"><h2 data-i18n="emulator_t"></h2><p data-i18n="emulator"></p></div>
  </a>
</div>
<div class="lang" id="lang-btns">
  <button data-lang="system" data-i18n="system"></button>
  <button data-lang="en">English</button>
  <button data-lang="pt">Português</button>
</div>
<script>
VC_I18N.add({
  en: { pitch:'The glasses already see. VisualContext makes them remember.', manager:'People, encounters and memories',
        editor:'Glasses display layout — dev', emulator_t:'Emulator', emulator:'Simulates the glasses display with your camera — dev', system:'Phone language' },
  pt: { pitch:'Os óculos já veem. O VisualContext faz eles lembrarem.', manager:'Pessoas, encontros e memórias',
        editor:'Layout do visor dos óculos — dev', emulator_t:'Emulador', emulator:'Simula o visor dos óculos com a câmera — dev', system:'Idioma do celular' }
});
function mark(){ var c = VC_I18N.isUserChoice() ? VC_I18N.lang : 'system';
  document.querySelectorAll('#lang-btns button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-lang') === c); }); }
document.querySelectorAll('#lang-btns button').forEach(function(b){
  b.addEventListener('click', function(){ VC_I18N.set(b.getAttribute('data-lang')); });
});
window.addEventListener('vc-lang', mark);
VC_I18N.apply(); mark();
</script>
</body>
</html>
