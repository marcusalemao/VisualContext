<html lang="pt-BR">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VisualContext — memória para óculos inteligentes</title>
<meta name="description" content="VisualContext gives smart glasses a memory: who is in front of you, where you left your keys, where you parked, what you agreed yesterday.">
<meta property="og:title" content="VisualContext — the glasses already see. Now they remember.">
<meta property="og:description" content="A memory for Rokid smart glasses: faces, objects, places and conversations — and a web Manager where you just ask.">
<meta property="og:image" content="https://vc.alema.io/brand/visualcontext-icon-512.png">
<meta property="og:url" content="https://vc.alema.io/">
<link rel="canonical" href="https://vc.alema.io/">
<link rel="icon" href="/brand/visualcontext-symbol.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/brand/visualcontext-icon-512.png">

<style>
:root{--bg:#07090c;--s1:#0d1217;--s2:#121a20;--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.2);--g:#00ff88;--g2:#8fdfb5;--t:#e8f0ec;--m:#9aaaa2;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--w:1080px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--t);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--g)}img{max-width:100%;display:block}
.wrap{max-width:var(--w);margin:0 auto;padding:0 16px}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;z-index:99;background:var(--g);color:var(--bg);padding:8px 12px;border-radius:8px}
header{position:sticky;top:0;z-index:10;background:#07090c;border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;min-height:64px}
header .logo img{height:40px;width:auto}
header nav{display:flex;gap:18px;margin-left:auto;align-items:center}header nav a{color:var(--t);text-decoration:none;font-size:15px}header nav a:hover{color:var(--g)}
.lang{display:flex;gap:4px}.lang button{min-height:36px;min-width:40px;border-radius:10px;border:1px solid var(--line2);background:var(--s1);color:var(--t);font:600 13px system-ui;cursor:pointer}.lang button.on{border-color:var(--g);color:var(--g)}
@media (max-width:760px){header nav a{display:none}header nav a.keep{display:inline}}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 22px;border-radius:14px;border:2px solid var(--g);color:var(--g);text-decoration:none;font-weight:700;font-size:16px;background:transparent}
.btn.pri{background:var(--g);color:var(--bg)}.btns{display:flex;gap:12px;flex-wrap:wrap}
section{padding:72px 0;border-bottom:1px solid var(--line)}
h1{font-size:clamp(34px,6vw,58px);line-height:1.05;margin:0 0 18px;letter-spacing:-.02em}h1 em{font-style:normal;color:var(--g)}
h2{font-size:clamp(26px,4vw,38px);line-height:1.15;margin:0 0 12px;letter-spacing:-.01em}
.kicker{font:600 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--g);margin:0 0 12px}
.lead{font-size:clamp(18px,2.2vw,21px);color:var(--g2);max-width:640px;margin:0 0 26px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
/* the lens mock */
.lens{position:relative;aspect-ratio:4/3;border-radius:26px;overflow:hidden;border:2px solid #1d4a33;background:radial-gradient(120% 90% at 30% 20%,#2b3a33 0%,#141c18 45%,#0a0f0c 100%)}
.lens .person{position:absolute;left:46%;top:22%;width:30%;height:52%;border-radius:46% 46% 40% 40%;background:linear-gradient(180deg,#5d4a40,#3a2c25 60%,#2a201b);filter:blur(1px);opacity:.85}
.lens .person::after{content:"";position:absolute;left:-30%;right:-30%;top:78%;height:70%;border-radius:40% 40% 0 0;background:#24302b}
.lens .box{position:absolute;left:43%;top:18%;width:36%;height:44%}
.lens .box i{position:absolute;width:22%;height:22%;border:3px solid var(--g)}
.lens .box i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.lens .box i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}.lens .box i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}.lens .box i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.lens .tag{position:absolute;left:43%;top:9%;background:rgba(0,0,0,.75);color:var(--g);font:600 15px system-ui;padding:3px 9px;border-radius:6px}
.lens .card{position:absolute;left:4%;bottom:6%;width:min(78%,330px);background:rgba(4,14,9,.88);border:2px solid var(--g);border-radius:14px;padding:12px 14px;font:13px/1.5 var(--mono);color:#cfeedd}
.lens .card b{display:block;font:700 18px system-ui;color:var(--g);margin-bottom:4px}
.lens .rec{position:absolute;right:4%;top:5%;font:12px var(--mono);color:var(--g)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}@media (max-width:860px){.grid3{grid-template-columns:1fr}}
.tile{background:var(--s1);border:1px solid var(--line2);border-radius:18px;padding:20px}.tile .ic{font-size:26px;color:var(--g)}.tile h3{margin:8px 0 6px;font-size:19px}.tile p{margin:0;color:var(--m);font-size:16px}
/* the Manager mock */
.mgr{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}@media (max-width:860px){.mgr{grid-template-columns:1fr}}
.ask{background:var(--s1);border:1px solid var(--line2);border-radius:20px;padding:18px}
.q{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line2);border-radius:14px;padding:12px 14px;font-size:17px;color:var(--t);background:var(--bg)}.q span{color:var(--g)}
.a{margin-top:12px;border:1.5px solid var(--g);border-radius:14px;padding:14px;background:#0a1f14}
.a .row{display:flex;gap:12px;align-items:center}.a .ph{width:64px;height:64px;border-radius:12px;background:linear-gradient(135deg,#2d3b34,#151d19);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:26px}
.a small{display:block;color:var(--m);font-size:14px}.a .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.a .acts span{border:1px solid #1f6b44;color:var(--g);border-radius:99px;padding:4px 10px;font-size:13px}
.examples{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.examples span{border:1px dashed #1f6b44;border-radius:99px;padding:6px 12px;color:var(--g2);font-size:14px}
.steps{counter-reset:s;display:grid;gap:14px;margin-top:24px}.steps li{list-style:none;counter-increment:s;display:flex;gap:14px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px}
.steps li::before{content:counter(s);flex:0 0 36px;height:36px;border-radius:50%;background:var(--g);color:var(--bg);font-weight:800;display:flex;align-items:center;justify-content:center}
.steps b{display:block}.steps span{color:var(--m)}ol.steps{padding:0}
.priv{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:24px}@media (max-width:760px){.priv{grid-template-columns:1fr}}
.priv div{background:var(--s1);border-left:4px solid var(--g);border-radius:12px;padding:14px 16px}.priv b{display:block;margin-bottom:2px}.priv span{color:var(--m);font-size:16px}
.dl{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}@media (max-width:860px){.dl{grid-template-columns:1fr}}
.dl .tile .btn{margin-top:14px}
footer{padding:36px 0 90px;color:var(--m);font-size:15px}footer .wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between}footer a{color:var(--g2)}
footer button{background:none;border:0;color:var(--g2);text-decoration:underline;font:inherit;cursor:pointer;padding:0}

<body>
<a class="skip" href="#main" data-i18n="skip"></a>
<header><div class="wrap">
  <a class="logo" href="/" aria-label="VisualContext"><img src="/brand/visualcontext-logo-transparent.png" alt="VisualContext"></a>
  <nav aria-label="menu">
    <a href="#lens" data-i18n="nav_how"></a><a href="#manager" data-i18n="nav_manager"></a><a href="#privacy" data-i18n="nav_privacy"></a><a href="#download" data-i18n="nav_download"></a>
    <a class="keep" href="/manager" data-i18n="nav_login"></a>
    <span class="lang" id="lang"><button data-l="pt">PT</button><button data-l="en">EN</button></span>
  </nav>
</div></header>

<main id="main">
<section><div class="wrap hero">
  <div>
    <p class="kicker" data-i18n="kicker"></p>
    <h1><span data-i18n="h1a"></span> <em data-i18n="h1b"></em></h1>
    <p class="lead" data-i18n="lead"></p>
    <div class="btns"><a class="btn pri" href="/demo" data-i18n="cta_demo" data-ev="cta_demo"></a><a class="btn" href="/demo-film" data-i18n="cta_film" data-ev="cta_film"></a></div>
  </div>
  <div class="lens" role="img" data-i18n-aria="lens_alt">
    <div class="person"></div>
    <div class="box"><i></i><i></i><i></i><i></i></div>
    <div class="tag">Ana Souza</div>
    <div class="rec" data-i18n="lens_rec"></div>
    <div class="card"><b>Ana Souza</b><span data-i18n="lens_l1"></span><br><span data-i18n="lens_l2"></span><br><span data-i18n="lens_l3"></span></div>
  </div>
</div></section>

<section id="lens"><div class="wrap">
  <p class="kicker" data-i18n="k_lens"></p>
  <h2 data-i18n="h_lens"></h2>
  <p class="lead" data-i18n="p_lens"></p>
  <div class="grid3">
    <div class="tile"><div class="ic">◉</div><h3 data-i18n="t1"></h3><p data-i18n="t1p"></p></div>
    <div class="tile"><div class="ic">⌖</div><h3 data-i18n="t2"></h3><p data-i18n="t2p"></p></div>
    <div class="tile"><div class="ic">✦</div><h3 data-i18n="t3"></h3><p data-i18n="t3p"></p></div>
  </div>
</div></section>

<section id="manager"><div class="wrap mgr">
  <div>
    <p class="kicker" data-i18n="k_mgr"></p>
    <h2 data-i18n="h_mgr"></h2>
    <p class="lead" data-i18n="p_mgr"></p>
    <div class="examples"><span data-i18n="ex1"></span><span data-i18n="ex2"></span><span data-i18n="ex3"></span><span data-i18n="ex4"></span></div>
  </div>
  <div class="ask" aria-label="Manager">
    <div class="q"><span>✦</span><span style="color:var(--t)" data-i18n="mq"></span></div>
    <div class="a">
      <div class="row"><div class="ph">🏍</div><div><span data-i18n="ma"></span><small data-i18n="mas"></small></div></div>
      <div class="acts"><span data-i18n="m_map"></span><span data-i18n="m_sv"></span><span data-i18n="m_go"></span></div>
    </div>
    <div class="q" style="margin-top:14px"><span>✦</span><span style="color:var(--t)" data-i18n="mq2"></span></div>
    <div class="a"><span data-i18n="ma2"></span></div>
  </div>
</div></section>

<section id="how"><div class="wrap">
  <p class="kicker" data-i18n="k_how"></p>
  <h2 data-i18n="h_how"></h2>
  <ol class="steps">
    <li><div><b data-i18n="s1"></b><span data-i18n="s1p"></span></div></li>
    <li><div><b data-i18n="s2"></b><span data-i18n="s2p"></span></div></li>
    <li><div><b data-i18n="s3"></b><span data-i18n="s3p"></span></div></li>
  </ol>
</div></section>

<section id="privacy"><div class="wrap">
  <p class="kicker" data-i18n="k_priv"></p>
  <h2 data-i18n="h_priv"></h2>
  <div class="priv">
    <div><b data-i18n="pv1"></b><span data-i18n="pv1p"></span></div>
    <div><b data-i18n="pv2"></b><span data-i18n="pv2p"></span></div>
    <div><b data-i18n="pv3"></b><span data-i18n="pv3p"></span></div>
    <div><b data-i18n="pv4"></b><span data-i18n="pv4p"></span></div>
  </div>
</div></section>

<section id="download"><div class="wrap">
  <p class="kicker" data-i18n="k_dl"></p>
  <h2 data-i18n="h_dl"></h2>
  <div class="dl">
    <div class="tile"><div class="ic">▶</div><h3 data-i18n="d1"></h3><p data-i18n="d1p"></p><a class="btn pri" href="/demo" data-i18n="cta_demo" data-ev="dl_demo"></a></div>
    <div class="tile"><div class="ic">⬇</div><h3 data-i18n="d2"></h3><p data-i18n="d2p"></p><a class="btn" id="beta" href="https://vc.alema.io/test-invite/" data-i18n="d2b" data-ev="dl_beta"></a></div>
    <div class="tile"><div class="ic">📱</div><h3 data-i18n="d3"></h3><p data-i18n="d3p"></p></div>
  </div>
</div></section>
</main>

<footer><div class="wrap">
  <span>VisualContext · <a href="https://alema.io">Alema</a> · São Paulo</span>
  <span><a href="/manager" data-i18n="nav_login"></a> · <a href="/demo-film" data-i18n="cta_film"></a> · <button type="button" id="cons" data-i18n="consent"></button></span>
</div></footer>

function paint(){
  VC_I18N.apply();
  document.querySelectorAll("[data-i18n-aria]").forEach(e => e.setAttribute("aria-label", VC_I18N.t(e.dataset.i18nAria)));
  document.querySelectorAll("#lang button").forEach(b => b.classList.toggle("on", b.dataset.l === VC_I18N.lang));
  const pt = VC_I18N.lang === "pt";
  document.getElementById("beta").href = "https://vc.alema.io/test-invite/"; // the request form (Marcus, 09/11), approved in the Manager

}
document.getElementById("lang").onclick = e => { const l = e.target.dataset.l; if (l) VC_I18N.set(l); };

document.addEventListener("click", e => { const a = e.target.closest("[data-ev]"); if (a && window.vcTrack) window.vcTrack(a.dataset.ev); });
document.getElementById("cons").onclick = () => window.vcConsentReset && window.vcConsentReset();
