<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VisualContext</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0e1a;color:#f0f4ff;font-family:-apple-system,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
h1{font-size:22px;font-weight:700;color:#00ff88;margin-bottom:6px}
.sub{font-size:13px;color:rgba(255,255,255,.4);margin-bottom:32px}
.cards{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px}
a{display:flex;align-items:center;gap:14px;padding:16px;background:#111827;
  border:1px solid rgba(255,255,255,.08);border-radius:14px;text-decoration:none;color:#f0f4ff}
a:active{opacity:.8}
.ic{font-size:26px;width:44px;text-align:center;flex-shrink:0}
.info h2{font-size:15px;font-weight:600}
.info p{font-size:12px;color:rgba(255,255,255,.4);margin:0}
a.primary{border-color:rgba(0,255,136,.25);background:rgba(0,255,136,.07)}
</style>
</head>
<body>
<h1>⬡ VisualContext</h1>
<p class="sub">Os óculos já veem. O VisualContext faz eles lembrarem.</p>
<div class="cards">
  <a href="/webapp" class="primary">
    <div class="ic">👥</div>
    <div class="info"><h2>Manager</h2><p>Pessoas, encontros e memórias</p></div>
  </a>
  <a href="/hud-editor">
    <div class="ic">🛠</div>
    <div class="info"><h2>HUD Editor</h2><p>Layout do visor dos óculos — dev</p></div>
  </a>
  <a href="/emulator-standalone">
    <div class="ic">📟</div>
    <div class="info"><h2>Emulador</h2><p>Simula o visor dos óculos com a câmera — dev</p></div>
  </a>
</div>
</body>
</html>
