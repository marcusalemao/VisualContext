<style>
:root{--bg:#07090c;--s1:#0d1217;--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.2);--g:#00ff88;--g2:#8fdfb5;--t:#e8f0ec;--m:#9aaaa2;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--g)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;min-height:64px}
header .logo img{height:40px;width:auto;display:block}
.lang{margin-left:auto;display:flex;gap:4px}
.lang button{min-height:36px;min-width:40px;border-radius:10px;border:1px solid var(--line2);background:var(--s1);color:var(--t);font:600 13px system-ui;cursor:pointer}
.lang button.on{border-color:var(--g);color:var(--g)}
.kicker{font:600 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--g);margin:0 0 12px}
h1{font-size:clamp(30px,5vw,46px);line-height:1.08;margin:0 0 14px;letter-spacing:-.02em}
h2{font-size:22px;margin:0 0 10px}
.lead{font-size:clamp(17px,2vw,19px);color:var(--g2);margin:0 0 22px}
.top{padding:40px 16px 32px}
.get{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:var(--s1);border:2px solid var(--g);border-radius:18px;padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 24px;border-radius:14px;border:2px solid var(--g);background:var(--g);color:var(--bg);font:700 17px system-ui;text-decoration:none}
.btn .ic{width:22px;height:22px}
.meta{color:var(--m);font-size:14px;margin:6px 0 0}
.qr{display:none;align-items:center;gap:16px}
.qr .box{background:#fff;padding:8px;border-radius:10px}
.qr .box img{display:block;width:132px;height:132px;image-rendering:pixelated}
.qr p{margin:0;color:var(--t);max-width:260px}
.desk .qr{display:flex}
.mine{background:var(--s1);border:2px solid var(--g);border-radius:18px;padding:20px;margin:0 0 16px}
.mine .hi{margin:0 0 4px;font-size:20px;font-weight:700}
.mine .code{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:10px 0 0}
.mine .code span{font:700 clamp(26px,6vw,36px) var(--mono);letter-spacing:.12em;color:var(--g);user-select:all;-webkit-user-select:all}
.mine .code button{min-height:44px;padding:0 18px;border-radius:12px;border:2px solid var(--g);background:transparent;color:var(--g);font:700 15px system-ui;cursor:pointer}
section{padding:32px 0;border-top:1px solid var(--line)}
ol.steps{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:12px;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:4px 12px;align-content:start;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
ol.steps li::before{content:counter(s);grid-row:1 / span 2;width:36px;height:36px;border-radius:50%;border:2px solid var(--g);color:var(--g);display:flex;align-items:center;justify-content:center;font:700 16px var(--mono)}
ol.steps b{font-size:17px}
ol.steps p{margin:0;color:var(--g2)}
.box2{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:12px}
.box2 p{margin:0}
.note{color:var(--m);font-size:15px}
.plan{list-style:none;padding:0;margin:20px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:12px;counter-reset:r}
@media (max-width:820px){.plan{grid-template-columns:1fr}}
.plan li{counter-increment:r;display:grid;align-content:start;grid-auto-rows:min-content;grid-template-columns:44px 1fr;gap:4px 12px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.plan li::before{content:counter(r);grid-row:1 / span 3;width:36px;height:36px;border-radius:50%;border:2px solid var(--g);color:var(--g);display:flex;align-items:center;justify-content:center;font:700 16px var(--mono)}
.plan b{color:var(--t);font-size:17px}
.plan p{margin:0;color:var(--g2)}
.plan .say{margin-top:6px;font:13px/1.5 var(--mono);color:var(--m)}
.g{color:var(--g)}
.tip{margin:18px 0 0;color:var(--m);font-size:15px}
footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--m);font-size:14px}
</style>
</head>

<header><div class="wrap">

    <div>
      <a class="btn" id="dl" href="#"><span data-i="download"></span><span data-t="btn"></span></a>
      <p class="meta" data-t="meta"></p>
    </div>
    <div class="qr"><div class="box"><img id="qr" alt=""></div><p data-t="qr"></p></div>
  </div>
</div>

<section><div class="wrap">
  <h2 data-t="h_steps"></h2>
  <ol class="steps">
    <li><b data-t="s1"></b><p data-t="s1p"></p></li>
    <li><b data-t="s2"></b><p data-t="s2p"></p></li>
    <li><b data-t="s3"></b><p data-t="s3p"></p></li>
    <li><b data-t="s4"></b><p data-t="s4p"></p></li>
    <li><b data-t="s5"></b><p data-t="s5p"></p></li>
  </ol>
</div></section>

<section id="roteiro" hidden><div class="wrap">
  <p class="kicker" data-t="k_plan"></p>
  <h2 data-t="h_plan"></h2>

  <ol class="plan">
    <li><b data-t="r1"></b><p data-t="r1p"></p><p class="say" data-t="r1s"></p></li>
    <li><b data-t="ri"></b><p data-t="rip"></p><p class="say" data-t="ris"></p></li>
    <li><b data-t="r2"></b><p data-t="r2p"></p><p class="say" data-t="r2s"></p></li>
    <li><b data-t="r3"></b><p data-t="r3p"></p><p class="say" data-t="r3s"></p></li>
    <li><b data-t="r4"></b><p data-t="r4p"></p><p class="say" data-t="r4s"></p></li>
    <li><b data-t="r5"></b><p data-t="r5p"></p><p class="say" data-t="r5s"></p></li>
    <li><b data-t="rm"></b><p data-t="rmp"></p><p class="say" data-t="rms"></p></li>
    <li><b data-t="r6"></b><p data-t="r6p"></p><p class="say" data-t="r6s"></p></li>
    <li><b data-t="r7"></b><p data-t="r7p"></p><p class="say" data-t="r7s"></p></li>
    <li><b data-t="r8"></b><p data-t="r8p"></p><p class="say" data-t="r8s"></p></li>
  </ol>
  <p class="tip" data-t="tip"></p>
</div></section>

<section><div class="wrap">
  <h2 data-t="h_more"></h2>
  <div class="box2"><p data-t="m1"></p></div>
  <div class="box2"><p data-t="m2"></p></div>
  <div class="box2"><p data-t="m3"></p></div>
</div></section>
</main>

<footer><div class="wrap">VisualContext · <a href="https://alema.io">Alema</a> · São Paulo · <a href="/" data-t="home"></a></div></footer>
