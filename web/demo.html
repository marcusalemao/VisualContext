<html lang="en">
<head>
<meta charset="utf-8">

<meta property="og:description" content="A memory layer for smart glasses. 4-minute concept film: people, things, places, recall, privacy. EN / DE / PT.">
<title>VisualContext Demo Film</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one 16:9 "film" stage (the glasses view, green HUD over a dim world) with a caption band below; a thin control bar that hides while recording. */
:root{
  --bg:#050807; --ink:#e6f2ea; --mute:#8fa89a; --panel:#0b1410; --line:#1a3324;
  --g:#00ff88; --g2:#8fdfb5; --g3:rgba(0,255,136,.6); --g4:rgba(0,255,136,.25);
  --world:#1b1f1c; --world2:#2a2f2b;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
#wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:12px;height:100%;min-height:0}
#film{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:0 1 auto}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
#world{position:absolute;left:0;top:0;width:1920px;height:720px;background:radial-gradient(ellipse at 33% 70%,var(--world2),var(--world) 60%)}
#world svg{position:absolute;left:0;top:0;width:1280px;height:720px}
#hud{position:absolute;inset:0;font-family:var(--mono);color:var(--g);text-shadow:0 0 6px rgba(0,255,136,.35)}
#lens{position:absolute;left:160px;top:40px;width:960px;height:540px;border:1px dashed rgba(0,255,136,.12);border-radius:6px}
.el{position:absolute;opacity:0;transition:opacity .45s ease,transform .45s ease;transform:translateY(6px)}
.el.on{opacity:1;transform:none}
.dot{width:10px;height:10px;border-radius:50%;background:var(--g)}
.tag{font-size:22px;font-weight:600;letter-spacing:.5px;white-space:nowrap}
.tag:before{content:"";display:inline-block;width:14px;height:2px;background:var(--g3);vertical-align:middle;margin-right:8px}
.card{border:2px solid var(--g3);border-radius:14px;padding:14px 18px;min-width:300px;max-width:430px}
.card .t{font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;line-height:1.1}
.card .r{height:2px;background:var(--g3);margin:8px 0 10px}
.card .l{font-size:19px;color:var(--g2);line-height:1.35}
.card .f{font-size:14px;color:var(--g);margin-top:10px;letter-spacing:.5px}
.card .row{display:flex;gap:14px;align-items:flex-start}
.card .thumb{width:84px;height:84px;border:2px solid var(--g3);border-radius:8px;flex:0 0 auto;display:grid;place-items:center}
.card .thumb svg{width:70px;height:70px;stroke:var(--g2);fill:none;stroke-width:2}
.card.dashed{border-style:dashed}
.card.small{min-width:220px;padding:10px 14px}
.card.small .t{font-size:20px}
.card.small .l{font-size:15px}
.rec{font-size:20px;font-weight:600}
.rec b{font-size:22px}
.pin:after{content:"";position:absolute;left:50%;bottom:-16px;width:2px;height:14px;background:var(--g3)}
.pin.dashed:after{background:none;border-left:2px dashed var(--g3)}
.say{font-size:20px;color:var(--g2);font-style:italic}
.say:before{content:"🎙 ";font-style:normal;opacity:.8}
.sp{font-size:20px;color:var(--g2)}
.sp:before{content:"🔈 ";opacity:.8}
.arrow{font-size:46px;font-weight:700;line-height:1}
.ai{font-size:18px;color:var(--g2)}
.phone{position:absolute;left:470px;top:60px;width:340px;height:620px;border:2px solid #2a4a36;border-radius:34px;background:#06100a;padding:22px 18px;font-family:var(--sans);color:#d9efe2;overflow:hidden}
.phone .ask{border:2px solid var(--g3);border-radius:14px;padding:12px 14px;font-size:16px;color:var(--g2);display:flex;gap:8px;align-items:center}
.phone .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.phone .chip{border:1.5px dashed var(--g3);border-radius:999px;padding:6px 10px;font-size:13px;color:var(--g2)}
.phone .pills{display:flex;gap:6px;margin-top:14px;font-size:12px}
.phone .pill{border:1.5px solid var(--g3);border-radius:999px;padding:4px 9px;color:var(--g2)}
.phone .pill.on{background:var(--g4);color:var(--g)}
.phone .ans{border:2px solid var(--g3);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:14px;line-height:1.45}
.phone .ans .src{margin-top:8px;font-size:12px;color:var(--mute)}
.phone .ans .btn{display:inline-block;border:1.5px solid var(--g3);border-radius:8px;padding:4px 9px;font-size:12px;color:var(--g);margin-top:8px;margin-right:6px}
.phone .day{margin-top:14px;font-size:13px;line-height:1.5;color:#b9d9c7}
.phone .day .h{font-size:11px;letter-spacing:1.5px;color:var(--g);margin-bottom:4px}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:560px}
.mod{border:2px solid var(--g3);border-radius:12px;padding:12px 14px}
.mod .t{font-size:20px;font-weight:700}
.mod .l{font-size:14px;color:var(--g2);margin-top:4px;line-height:1.35}
.mod.on{background:var(--g4)}
.list{font-size:22px;line-height:1.7;color:var(--g2)}
.list b{color:var(--g)}
.title{font-size:64px;font-weight:700;letter-spacing:-1px;line-height:1}
.sub{font-size:24px;color:var(--g2);margin-top:14px;line-height:1.35}
.tiny{font-size:16px;color:var(--g2);opacity:.8;margin-top:24px}
#cap{font-size:clamp(16px,1.9vw,22px);line-height:1.45;color:var(--ink);min-height:3.2em;padding:4px 2px;text-wrap:balance}
#cap small{display:block;font-size:.7em;color:var(--mute);margin-top:4px;font-family:var(--mono);letter-spacing:.5px}
#bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:13px;color:var(--mute);transition:opacity .3s}
#bar.hide{opacity:0;pointer-events:none}
#bar button{background:var(--panel);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:13px;padding:7px 12px;border-radius:8px;cursor:pointer}
#bar button:focus-visible{outline:2px solid var(--g)}
#bar button.on{border-color:var(--g);color:var(--g)}
#prog{display:flex;gap:4px;flex:1;min-width:120px}
#prog i{flex:1;height:4px;background:var(--line);border-radius:2px}
#prog i.done{background:var(--g3)}
#prog i.now{background:var(--g)}
.world-ground{fill:none;stroke:#3a403c;stroke-width:2}
.person{fill:#262b28;stroke:#4a524d;stroke-width:2}
@media (prefers-reduced-motion:reduce){.el{transition:none}}
@media (max-width:700px){#cap{min-height:4.5em}}
</style>
</head>
<body>
<div id="wrap">
  <div id="film">
    <div id="stage">
      <div id="world"></div>

  </div>
  <div id="cap"></div>
  <div id="bar">
    <button id="play">▶ Play</button>
    <button id="prev">◀</button><button id="next">▶</button>

    <button id="lang">EN</button>
    <button id="full">⛶</button>
    <span>space · ← → · L language · H hide bar · F fullscreen</span>
  </div>
</div>
<script>

function bedIcon(){ return '<svg viewBox="0 0 70 70"><path d="M8 50 L8 30 L62 30 L62 50 M8 50 L8 58 M62 50 L62 58 M14 30 L14 18 L30 18 L30 30"/><path d="M40 36 L52 48 M46 40 l6 0 l0 6"/></svg>'; }
function bikeIcon(){ return '<svg viewBox="0 0 70 70"><circle cx="18" cy="48" r="11"/><circle cx="52" cy="48" r="11"/><path d="M18 48 L30 28 L44 28 L52 48 M30 28 L36 40 L48 40 M44 28 L48 20 L56 20"/></svg>'; }
function shopIcon(){ return '<svg viewBox="0 0 70 70"><path d="M10 30 L10 60 L60 60 L60 30 M6 30 L64 30 L58 16 L12 16 Z M28 60 L28 42 L42 42 L42 60"/></svg>'; }

// ---- captions: en / de / pt ----
var T={
 title:{en:['VisualContext','A memory layer for smart glasses. It remembers people, things and places for you, and shows nothing until you need it.','Concept film · recorded on the simulator · São Paulo, November 2026'],
        de:['VisualContext','Eine Gedächtnisschicht für Smart Glasses. Sie merkt sich Menschen, Dinge und Orte für dich und zeigt nichts, bis du es brauchst.','Konzeptfilm · aufgenommen im Simulator · São Paulo, November 2026'],
        pt:['VisualContext','Uma camada de memória para óculos inteligentes. Lembra pessoas, coisas e lugares por você, e não mostra nada até você precisar.','Filme-conceito · gravado no simulador · São Paulo, novembro de 2026']},
 standby:{en:'Standby. Most of the day the lens is empty: a single dot says the memory is on. Nothing is recorded, nothing is shown.',
          de:'Standby. Den größten Teil des Tages bleibt die Linse leer: ein einzelner Punkt zeigt, dass das Gedächtnis an ist. Nichts wird aufgenommen, nichts angezeigt.',
          pt:'Standby. Na maior parte do dia a lente fica vazia: um único ponto diz que a memória está ligada. Nada é gravado, nada é mostrado.'},
 meet:{en:'You meet someone. The face is recognised on the device, nothing leaves your phone. A short card: name, how you know each other, last time you met. Then the encounter is recorded, after a countdown you can cancel.',
       de:'Du triffst jemanden. Das Gesicht wird auf dem Gerät erkannt, nichts verlässt dein Telefon. Eine kurze Karte: Name, woher ihr euch kennt, letztes Treffen. Dann wird die Begegnung aufgezeichnet, nach einem Countdown, den du abbrechen kannst.',
       pt:'Você encontra alguém. O rosto é reconhecido no aparelho, nada sai do seu celular. Um card curto: nome, de onde se conhecem, última vez. Depois o encontro é gravado, após uma contagem que você pode cancelar.'},
 three:{en:'Several people: a name beside each head. The full card follows the person you are looking at.',
        de:'Mehrere Personen: ein Name neben jedem Kopf. Die ganze Karte folgt der Person, die du gerade ansiehst.',
        pt:'Várias pessoas: um nome ao lado de cada cabeça. O card completo acompanha a pessoa para quem você está olhando.'},
 unknown:{en:'No name yet? Never "Person 1". The card describes the person and the occasion. It corrects itself as the conversation goes: when someone says the name, or a badge is read, the description becomes a name. Later, the occasion is what you remember.',
          de:'Noch kein Name? Nie „Person 1“. Die Karte beschreibt die Person und den Anlass. Sie korrigiert sich im Gespräch: nennt jemand den Namen oder wird ein Namensschild gelesen, wird aus der Beschreibung ein Name. Später ist der Anlass das, woran du dich erinnerst.',
          pt:'Sem nome ainda? Nunca "Pessoa 1". O card descreve a pessoa e a ocasião. Ele se corrige ao longo da conversa: quando alguém diz o nome, ou um crachá é lido, a descrição vira nome. Depois, a ocasião é o que você lembra.'},
 key:{en:'Things. Say "this is my key" once, with the key in your hand. Later, "where is my key?" brings back the last photo where it was seen, with the room and the time.',
      de:'Dinge. Sag einmal „das ist mein Schlüssel“, mit dem Schlüssel in der Hand. Später holt „wo ist mein Schlüssel?“ das letzte Foto zurück, auf dem er gesehen wurde, mit Raum und Uhrzeit.',
      pt:'Coisas. Diga uma vez "essa é a minha chave", com a chave na mão. Depois, "onde está minha chave?" traz a última foto em que ela foi vista, com o cômodo e a hora.'},
 bike:{en:'The motorbike. When you stop riding and start walking, the glasses save the spot and two photos: the bike and the surroundings. If the key stayed on the bike, a quiet warning. Later: "where did I leave the motorbike?" Then one question, never two: "Want to go there? On foot it\'s 4 minutes." Say yes and the glasses guide you on foot; farther away they offer public transport, motorbike or car and hand it to the phone.',
       de:'Das Motorrad. Wenn du anhältst und losgehst, speichert die Brille den Ort und zwei Fotos: das Motorrad und die Umgebung. Blieb der Schlüssel am Motorrad, ein leiser Hinweis. Später: „Wo habe ich das Motorrad abgestellt?“ Dann eine Frage, nie zwei: „Willst du hin? Zu Fuß sind es 4 Minuten.“ Sag ja, und die Brille führt dich zu Fuß; weiter weg bietet sie Bahn, Motorrad oder Auto an und übergibt ans Telefon.',
       pt:'A moto. Quando você para de pilotar e começa a andar, os óculos guardam o local e duas fotos: a moto e o entorno. Se a chave ficou na moto, um aviso discreto. Depois: "onde deixei a moto?"'},
 places:{en:'Places. The two or three important places nearest you sit on their buildings and stay there when you turn your head; dashed means hidden behind another building. Want more? Ask the live assistant about the place you are looking at: today\'s exhibition, when it was built. It searches the web; only the place name goes out, never the picture.',
         de:'Orte. Die zwei, drei wichtigsten Orte in deiner Nähe sitzen auf ihren Gebäuden und bleiben dort, wenn du den Kopf drehst; gestrichelt heißt verdeckt. Mehr wissen? Frag den Live-Assistenten nach dem Ort, den du ansiehst: die Ausstellung heute, das Baujahr. Er sucht im Web; nur der Ortsname geht raus, nie das Bild.',
         pt:'Lugares. Os dois ou três lugares importantes mais próximos ficam presos aos seus prédios e seguem quando você vira a cabeça; tracejado é escondido atrás de outro prédio. Quer mais? Pergunte ao assistente ao vivo sobre o lugar que está olhando: a exposição de hoje, quando foi construído. Ele busca na internet; só o nome do lugar sai, nunca a imagem.'},
 recall:{en:'Recall. In standby, tap or press the AI button and ask in plain words. "Who was the person I just talked to?" brings the full card. Open questions go to a live voice assistant that sees what you see.',
         de:'Erinnern. Im Standby tippen oder die KI-Taste drücken und einfach fragen. „Wer war die Person, mit der ich gerade gesprochen habe?“ bringt die ganze Karte. Offene Fragen gehen an einen Sprachassistenten, der sieht, was du siehst.',
         pt:'Recordar. Em standby, toque ou aperte o botão de IA e pergunte com suas palavras. "Quem era a pessoa com quem falei agora?" traz o card completo. Perguntas abertas vão para um assistente de voz ao vivo que vê o que você vê.'},
 manager:{en:'On the phone, the Manager. Ask your memory anything; every answer shows its source. "My day" tells the day from what was recorded. Actions (calendar, task, map) happen only when you tap.',
          de:'Auf dem Telefon: der Manager. Frag dein Gedächtnis, was du willst; jede Antwort zeigt ihre Quelle. „Mein Tag“ erzählt den Tag aus dem, was aufgezeichnet wurde. Aktionen (Kalender, Aufgabe, Karte) passieren nur, wenn du tippst.',
          pt:'No celular, o Manager. Pergunte qualquer coisa à sua memória; toda resposta mostra a fonte. "Meu dia" conta o dia a partir do que foi registrado. Ações (agenda, tarefa, mapa) só acontecem quando você toca.'},
 modules:{en:'One app, four modules. General is already accessibility: a memory that does not depend on attention helps with ADHD, with the first years of dementia, with a busy life. Low vision speaks the card instead of showing it. Deaf: live captions with the speaker\'s name. The four switches stay in every module.',
          de:'Eine App, vier Module. Allgemein ist schon Barrierefreiheit: ein Gedächtnis, das nicht von Aufmerksamkeit abhängt, hilft bei ADHS, in den ersten Jahren einer Demenz, in einem vollen Alltag. Sehbehinderung spricht die Karte, statt sie zu zeigen. Gehörlos: Live-Untertitel mit dem Namen des Sprechers. Die vier Schalter bleiben in jedem Modul.',
          pt:'Um app, quatro módulos. O Geral já é acessibilidade: uma memória que não depende da atenção ajuda no TDAH, nos primeiros anos de uma demência, numa vida cheia. Baixa visão fala o card em vez de mostrar. Surdez: legenda ao vivo com o nome de quem fala. As quatro chaves ficam em todos os módulos.'},
 keep:{en:'What is kept. The camera is not a recorder: one frame is taken, described as text on the device, and thrown away. Audio is never stored, only the transcript. Of a face, one small crop. The glasses themselves keep nothing on disk. What is not kept cannot leak.',
       de:'Was bleibt. Die Kamera ist kein Rekorder: ein Bild wird aufgenommen, auf dem Gerät als Text beschrieben und verworfen. Audio wird nie gespeichert, nur die Mitschrift. Von einem Gesicht ein kleiner Ausschnitt. Die Brille selbst speichert nichts. Was nicht gespeichert ist, kann nicht abfließen.',
       pt:'O que fica. A câmera não é um gravador: um quadro é capturado, descrito em texto no aparelho e jogado fora. Áudio nunca é guardado, só a transcrição. De um rosto, um recorte pequeno. Os óculos não guardam nada em disco. O que não é guardado não vaza.'},
 sens:{en:'Sensitive moments, decided on the device, never in the cloud. Bathroom or locker room: camera and microphone pause. Nudity, a child at the pool: the moment survives only as a neutral sentence, written on the phone, no image ever saved, nothing sent anywhere. Intimacy: nothing at all. Children are never enrolled automatically. Strangers are never looked up.',
       de:'Sensible Momente, entschieden auf dem Gerät, nie in der Cloud. Bad oder Umkleide: Kamera und Mikrofon pausieren. Nacktheit, ein Kind am Pool: der Moment bleibt nur als neutraler Satz, auf dem Telefon geschrieben, kein Bild gespeichert, nichts verschickt. Intimität: gar nichts. Kinder werden nie automatisch erfasst. Fremde werden nie nachgeschlagen.',
       pt:'Momentos sensíveis, decididos no aparelho, nunca na nuvem. Banheiro ou vestiário: câmera e microfone pausam. Nudez, uma criança na piscina: o momento sobrevive só como uma frase neutra, escrita no celular, nenhuma imagem guardada, nada enviado. Intimidade: nada. Crianças nunca são cadastradas sozinhas. Estranhos nunca são procurados.'},
 privacy:{en:'Creepy or not creepy? Our answers: faces are recognised on the device and never uploaded. Every recording announces itself and can be cancelled. Take the glasses off and the app locks. One button forgets everything.',
          de:'Creepy oder nicht creepy? Unsere Antworten: Gesichter werden auf dem Gerät erkannt und nie hochgeladen. Jede Aufnahme kündigt sich an und kann abgebrochen werden. Brille ab, App gesperrt. Ein Knopf vergisst alles.',
          pt:'Creepy ou não creepy? Nossas respostas: rostos são reconhecidos no aparelho e nunca enviados. Toda gravação se anuncia e pode ser cancelada. Tirou os óculos, o app trava. Um botão esquece tudo.'},
 end:{en:['VisualContext','Built on Rokid Glasses · visualcontext.alema.io','Marcus de Magalhães · São Paulo · 2026'],
      de:['VisualContext','Gebaut auf Rokid Glasses · visualcontext.alema.io','Marcus de Magalhães · São Paulo · 2026'],
      pt:['VisualContext','Feito nos Rokid Glasses · visualcontext.alema.io','Marcus de Magalhães · São Paulo · 2026']},

        park:'Parking moment',parkL:'spot saved · 2 photos',warn:'Did the key come with you?',warnL:'it seems to be on the bike',askBike:'"where did I leave the motorbike?"',bikeT:'Motorbike',bikeL:'Rua Paim, 210 · in front of Padaria Boa',bikeW:'today 8:30 · 240 m',map:'',goQ:'Want to go there? On foot it\'s 4 minutes.',goY:'"yes"',nav1:'turn right in 50 m',nav2:'straight on · 180 m',nav3:'it\'s ahead, next to the bakery',far:'Want to go there? It\'s 6 km: metro 15 min, motorbike or car?',
