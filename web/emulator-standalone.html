<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>VisualContext — Rokid Emulator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;height:100%;overflow:hidden;font-family:monospace;color:#00ff88}

/* ══ WAVEGUIDE — 640x480 landscape, camera as background ══ */
#flip-cam-btn{
  position:absolute; bottom:8px; right:8px; z-index:50;
  width:34px; height:34px; border-radius:50%;
  background:rgba(0,20,10,.55); border:1px solid rgba(0,255,136,.35);
  color:#00ff88; font-size:15px; line-height:1;
  display:none; align-items:center; justify-content:center;
  cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  backdrop-filter:blur(2px);
}
#flip-cam-btn.show{display:flex}
#flip-cam-btn:active{background:rgba(0,255,136,.18); border-color:#00ff88}
#waveguide{
  position:relative;
  /* 640×480 on desktop; shrinks to fit on phones */
  width:100%; max-width:640px;
  aspect-ratio:4/3; height:auto;
  background:#000;
  overflow:hidden;
  border:1px solid #0a2a18;
  border-radius:8px;
  margin:0 auto;
  flex-shrink:0;
}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#cnv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* ── HUD overlay — everything on top of the camera ── */
#hud{position:absolute;inset:0;pointer-events:none;display:none}

/* Profile card — top left */
#hud-card{
  position:absolute; top:14px; left:14px;
  background:rgba(0,0,0,0.55);
  border:1px solid rgba(0,255,136,0.35);
  border-radius:8px; padding:10px 14px;
  min-width:200px; max-width:260px;
  backdrop-filter:blur(2px);
}
#hud-name{font-size:18px;font-weight:bold;color:#00ff88;line-height:1.2}
#hud-role{font-size:11px;color:#00cc6e;margin-top:2px}
#hud-co{font-size:11px;color:#00aa5a;margin-top:1px}
#hud-rel{font-size:10px;color:#008844;margin-top:4px;font-style:italic}
#hud-when{font-size:9px;color:#005533;margin-top:6px}
#hud-ctx{font-size:9px;color:#004428;margin-top:2px;font-style:italic}
#hud-sum-wrap{margin-top:8px;border-top:1px solid #123d22;padding-top:6px}
#hud-sum-lbl{font-size:8px;color:#00aa55;letter-spacing:1px;margin-bottom:3px}
#hud-sum{max-height:68px;overflow-y:auto;font-size:9.5px;line-height:1.55;color:#7fdfb0}
#hud-sum .sum-item{margin-bottom:4px}
#hud-sum .sum-when{color:#00cc66;font-weight:bold}
#hud-sum .sum-txt{color:#8fdfb5}

/* Countdown — new person, before recording is confirmed */
#hud-count{
  position:absolute; top:14px; left:14px;
  background:rgba(0,0,0,.55);
  border:1px solid rgba(0,255,136,.35);
  border-radius:8px; padding:10px 14px;
  min-width:210px; max-width:270px;
  display:none;
}
#hud-count.on{display:block}
#hc-title{font-size:13px;font-weight:bold;color:#00ff88;letter-spacing:.3px}
#hc-num{font-size:44px;font-weight:bold;color:#00ff88;line-height:1;margin:6px 0 4px}
#hc-hint{font-size:10px;color:#00aa55}

/* Recording indicator — discreet circle, top right */
#hud-rec{
  position:absolute; top:14px; right:14px;
  display:none; align-items:center; gap:6px;
  font-size:10px; color:#00cc6e;
  background:rgba(0,0,0,.45);
  border:1px solid rgba(0,255,136,.2);
  border-radius:12px; padding:3px 9px 3px 7px;
}
#hud-rec.on{display:flex}
#hud-rec .dot{width:8px;height:8px;border-radius:50%;background:#00ff88;animation:pulse 1.6s ease-in-out infinite}
#hud-rec.paused .dot{animation:none;background:transparent;border:1.5px solid #00aa55;width:7px;height:7px}
#hud-rec.paused{color:#00aa55}

/* System status — bottom left */
#hud-status{position:absolute;bottom:12px;left:14px;font-size:9px;color:#004422;line-height:1.6}

/* Idle state */
#hud-idle{
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:8px; font-size:11px; color:#002a14; pointer-events:none;
}

/* Capture flash */
#flash{position:absolute;inset:0;background:#00ff88;opacity:0;pointer-events:none;transition:opacity .05s}
#flash.on{opacity:.35}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ══ PAGE LAYOUT ══ */
body{
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  padding:8px 8px 170px; gap:8px;
  overflow-y:auto; overflow-x:hidden;
}
#top-bar{
  width:100%; max-width:640px;
  display:flex; justify-content:space-between; align-items:center;
  font-size:9px; color:#004422; letter-spacing:1px;
}
#sync-badge{font-size:9px;padding:2px 8px;border:1px solid #0a2a18;border-radius:10px}
#sync-badge.ok{color:#00ff88;border-color:#00aa55}
#sync-badge.err{color:#ff4400;border-color:#3a1000}

/* Log and badge only in debug mode (Help → On-screen log).
   Otherwise everything goes to the browser console — like on the glasses. */
#log-box,#sync-badge{display:none}
body.debug #log-box{display:block}
body.debug #sync-badge{display:inline}
#log-box{
  width:100%; max-width:640px;
  background:#060f09; border:1px solid #0a2a18; border-radius:8px;
  height:78px; overflow-y:auto; padding:6px 10px; font-size:11px;
}
.log-line{color:#006633;line-height:1.85}
.log-line.hi{color:#00ff88}
#help-debug{background:none;border:1px solid #0a2a18;color:#4ade80;font-family:inherit;font-size:10px;padding:6px 12px;border-radius:6px;cursor:pointer}

/* Phone panel (below the viewfinder) — mirrors the HUD state with buttons */
#match-box{width:100%;max-width:640px;display:none}
#match-box.on{display:block}
.mlbl{font-size:9px;color:#004422;letter-spacing:1px;margin-bottom:4px}
.mcount-lbl{font-size:11px;color:#007744;text-align:center;padding-bottom:6px;line-height:1.5}
.mcount-lbl b{color:#00ff88;font-size:14px}
.mbtn{background:#0a2015;border:1px dashed #1a5a2a;border-radius:8px;padding:9px 10px;margin-bottom:5px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:12px;color:#00ff88;font-weight:bold}
.mbtn:active{background:#0f3020}
.mbtn.no{background:#200a0a;border:1px solid #5a1a1a;color:#ff5566}
.mbtn.no:active{background:#2a0e0e}
.mbtn small{font-weight:normal;color:#007744;font-size:10px}
.mnomatch{font-size:10px;color:#007744;padding:2px 0 6px;text-align:center}

/* ══ BOTTOM BAR — temple gestures ══ */
#bottom-bar{
  position:fixed; bottom:0; left:0; right:0;
  background:#080f0a; border-top:1px solid #1a4a2a;
  padding:10px 10px 22px; display:flex; gap:6px; z-index:200;
}
.bar-btn{
  flex:1; min-width:0; padding:12px 2px 10px;
  background:#0f2018; border:1px solid #1a4a2a; border-radius:10px;
  color:#00aa55; font-size:18px; font-family:monospace; text-align:center;
  cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  user-select:none; line-height:1.1;
}
.bar-btn:active,.bar-btn.on{background:#0a3020;border-color:#00ff88;color:#00ff88}
.bar-btn:disabled{opacity:.3;pointer-events:none}
.bar-btn .blbl{font-size:10px;font-weight:600;display:block;margin-top:4px;color:#00aa55;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-btn:disabled .blbl{color:#004422}

/* ══ HELP OVERLAY (70%) ══ */
#help-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;align-items:center;justify-content:center;padding:20px}
#help-ov.on{display:flex}
#help-card{background:#0a1a0f;border:1.5px solid #1a4a2a;border-radius:16px;padding:20px 16px;width:100%;max-width:320px;max-height:80vh;overflow-y:auto;position:relative}
#help-x{position:absolute;top:10px;right:10px;width:30px;height:30px;background:#111;border:1px solid #1a3a22;border-radius:50%;color:#00aa55;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.h-tit{font-size:11px;color:#00ff88;letter-spacing:2px;margin-bottom:14px}
.h-sec{font-size:8px;color:#004422;letter-spacing:2px;margin:10px 0 6px;text-transform:uppercase}
.h-row{display:flex;gap:10px;margin-bottom:7px;align-items:flex-start}
.h-key{min-width:78px;padding:3px 5px;background:rgba(0,255,136,.06);border:1px solid rgba(0,255,136,.15);border-radius:5px;font-size:9px;color:#00ff88;text-align:center;flex-shrink:0}
.h-desc{font-size:9px;color:#007744;line-height:1.5}
.h-note{font-size:8px;color:#004422;line-height:1.6;margin-top:10px;border-top:1px solid #0a2a18;padding-top:8px}
.h-lang{display:flex;gap:6px;flex-wrap:wrap}
.h-lang button{background:none;border:1px solid #1a3a22;color:#00aa55;font-family:inherit;font-size:10px;padding:6px 10px;border-radius:6px;cursor:pointer}
.h-lang button.on{border-color:#00ff88;color:#00ff88;background:rgba(0,255,136,.08)}
</style>
<script src="/i18n.js"></script>

<div id="top-bar">
  <span>⬡ VISUALCONTEXT · <span data-i18n="topbar"></span></span>
  <span id="sync-badge"></span>
</div>

<!-- ══ WAVEGUIDE 640×480 — camera + HUD overlay ══ -->
<div id="waveguide">
  <video id="vid" autoplay playsinline muted></video>
  <button id="flip-cam-btn" type="button" data-i18n-title="flip">🔄</button>
  <canvas id="cnv"></canvas>
  <div id="flash"></div>

  <div id="hud-idle">
    <span style="font-size:32px;color:#002a14">◉</span>
    <span id="idle-main"></span>
    <span id="idle-sub" style="font-size:9px;color:#001a0c;max-width:240px;text-align:center;line-height:1.5"></span>
  </div>

  <div id="hud">
    <div id="hud-card" style="display:none">
      <div id="hud-name"></div>
      <div id="hud-role"></div>
      <div id="hud-co"></div>
      <div id="hud-rel"></div>
      <div id="hud-when"></div>
      <div id="hud-ctx"></div>
      <div id="hud-sum-wrap" style="display:none">
        <div id="hud-sum-lbl" data-i18n="encounters"></div>
        <div id="hud-sum"></div>
      </div>
    </div>
    <div id="hud-count">
      <div id="hc-title" data-i18n="count_title"></div>
      <div id="hc-num">5</div>
      <div id="hc-hint" data-i18n="count_hint"></div>
    </div>
    <div id="hud-rec"><span class="dot"></span><span id="hr-txt"></span></div>
    <div id="hud-status"></div>
  </div>
</div>

<div id="log-box"><div id="log-el"></div></div>

<!-- Phone panel — only shows when there is something to act on -->
<div id="match-box">
  <div class="mlbl" data-i18n="panel_lbl"></div>
  <div id="mlist"></div>
</div>

<!-- ══ BOTTOM BAR — Rokid temple gestures ══ -->
<div id="bottom-bar">
  <button class="bar-btn" id="btn-cam">⏻<span class="blbl" data-i18n="b_camera"></span></button>
  <button class="bar-btn" id="btn-tap" disabled>●<span class="blbl" data-i18n="b_tap"></span></button>
  <button class="bar-btn" id="btn-swipe" disabled>›<span class="blbl" data-i18n="b_swipe"></span></button>
  <button class="bar-btn" id="btn-dtap" disabled>●●<span class="blbl" data-i18n="b_dtap"></span></button>
  <button class="bar-btn" id="btn-help">?<span class="blbl" data-i18n="b_help"></span></button>
</div>

<!-- ══ HELP ══ -->
<div id="help-ov">
  <div id="help-card">
    <button id="help-x">✕</button>
    <div class="h-tit" data-i18n="h_title"></div>
    <div class="h-sec" data-i18n="h_sec_rec"></div>
    <div class="h-row"><span class="h-key" data-i18n="h_k_eye"></span><span class="h-desc" data-i18n="h_d_eye"></span></div>
    <div class="h-row"><span class="h-key" data-i18n="h_k_new"></span><span class="h-desc" data-i18n="h_d_new"></span></div>
    <div class="h-row"><span class="h-key" data-i18n="h_k_known"></span><span class="h-desc" data-i18n="h_d_known"></span></div>
    <div class="h-row"><span class="h-key" data-i18n="h_k_rec"></span><span class="h-desc" data-i18n="h_d_rec"></span></div>
    <div class="h-sec" data-i18n="h_sec_gest"></div>
    <div class="h-row"><span class="h-key" data-i18n="g_swipe"></span><span class="h-desc" data-i18n="h_d_swipe"></span></div>
    <div class="h-row"><span class="h-key" data-i18n="g_dtap"></span><span class="h-desc" data-i18n="h_d_dtap"></span></div>
    <div class="h-row"><span class="h-key" data-i18n="g_tap"></span><span class="h-desc" data-i18n="h_d_tap"></span></div>
    <div class="h-sec" data-i18n="h_sec_kbd"></div>
    <div class="h-row"><span class="h-key">Space / P</span><span class="h-desc" data-i18n="h_d_space"></span></div>
    <div class="h-row"><span class="h-key">Enter / ↑</span><span class="h-desc" data-i18n="g_tap"></span></div>
    <div class="h-row"><span class="h-key">→</span><span class="h-desc" data-i18n="g_swipe"></span></div>
    <div class="h-row"><span class="h-key">Esc / ↓</span><span class="h-desc" data-i18n="g_dtap"></span></div>
    <div class="h-sec" data-i18n="h_sec_lang"></div>
    <div class="h-lang" id="lang-btns">
      <button data-lang="system" data-i18n="lang_system"></button>
      <button data-lang="en">English</button>
      <button data-lang="pt">Português</button>
    </div>
    <div class="h-desc" style="margin-top:6px" data-i18n="h_d_lang"></div>
    <div class="h-sec" data-i18n="h_sec_dev"></div>
    <div class="h-row"><button id="help-debug"></button></div>
    <div class="h-note" data-i18n="h_note"></div>
  </div>
</div>

// ════════════════════════════════════════════════════════════════════════
// ENCOUNTER ENGINE
// Eye contact + speech → silent buffer (from the first frame) → after 7s:
//   • new person   → "Recording encounter! Swipe forward to cancel" 5…0 → save person → recording
//   • known person → recording starts on its own (no warning)
// Recording: discreet circle top-right. Double tap = stop & discard (person stays) → Resume (tap).
// Person leaves the view for 5s → encounter ends and is saved (text only, never audio/video).
// ════════════════════════════════════════════════════════════════════════
var MATCH_THRESHOLD   = 0.5;    // face distance for a confident match
var BUFFER_MS         = 7000;   // silent buffer before the countdown / recording
var COUNTDOWN_S       = 5;      // 5…0
var STABLE_FRAMES     = 3;      // ~1.2s of a stable face before the buffer starts
var SAME_FACE         = 0.5;    // max distance to keep treating it as the same person
var LEAVE_MS_PENDING  = 2500;   // left during buffer/countdown → discard
var LEAVE_MS_RECORD   = 5000;   // left during recording → end encounter and save
var MAX_SAMPLES       = 30;

var _state = 'idle';            // idle | buffer | countdown | recording | paused | saving
var _enc = null;                // current encounter
var _stable = { count:0, first:null };
var _suppressed = [];           // faces the user said no to (this session)
var _previewOpen = false;
var _lastMatchDescriptor = null;
var _lastMatchKnown = false;
var _lastFaceBox = null;
var _lastFaceAt = 0;
var _tickTimer = null;

function dist(a, b) { return faceapi.euclideanDistance(a, b); }
function isSuppressed(desc) { return _suppressed.some(function(d){ return dist(desc, d) < SAME_FACE; }); }

function bestMatch(descriptor) {
  if (!_descriptors.length) return null;
  var best = _descriptors.map(function(d){ return { profile:d.profile, dist:dist(descriptor, d.descriptor) }; })
    .sort(function(a,b){ return a.dist - b.dist; })[0];
  return (best && best.dist < MATCH_THRESHOLD) ? best : null;
}

// Called for the main face on every detection
function handleMatch(descriptor) {
  _lastMatchDescriptor = Array.from(descriptor);
  var m = bestMatch(descriptor);
  _lastMatchKnown = !!m;

  // An encounter is open: is this still the same person?
  if (_enc) {
    var same = dist(descriptor, _enc.anchor) < SAME_FACE * 1.2 ||
               (m && _enc.person && m.profile.id === _enc.person.id);
    if (same) {
      _enc.lastSeen = Date.now();
      if (_enc.samples.length < MAX_SAMPLES) _enc.samples.push(Array.from(descriptor));
      takeBestFrame();
      return;
    }
    // someone else in front: the current person is "not seen" — the tick decides when it ends
    if (_state === 'buffer' || _state === 'countdown') {
      if (Date.now() - _enc.lastSeen > LEAVE_MS_PENDING) endEncounter('left');
    }
    return;
  }

  if (_previewOpen || _state === 'saving') return;

  if (m) {
    showProfile(m.profile, Math.round((1 - m.dist) * 100));
    if (isSuppressed(descriptor)) return;   // user said no to this encounter: show the card, don't record
  } else {
    hideHudCard();
    if (isSuppressed(descriptor)) { renderSuppressed(); return; }
  }

  // wait for a stable face before opening an encounter
  if (_stable.first && dist(descriptor, _stable.first) > SAME_FACE * 1.2) _stable = { count:0, first:null };
  if (!_stable.first) _stable.first = Array.from(descriptor);
  _stable.count++;
  if (_stable.count >= STABLE_FRAMES) openEncounter(_stable.first, m ? m.profile : null);
  else if (!m) renderPanel();
}

function noFace() {
  _stable = { count:0, first:null };
  if (_enc) return;   // the tick decides when an open encounter ends
  if (Date.now() - _lastFaceAt > LEAVE_MS_PENDING && !_previewOpen && _state !== 'saving') {
    clearMatchBox(); hideHudCard();
  }
}

function openEncounter(anchor, person) {
  var now = Date.now();
  _stable = { count:0, first:null };
  _enc = {
    kind: person ? 'known' : 'new',
    person: person,
    anchor: new Float32Array(anchor),
    samples: [Array.from(anchor)],
    startedAt: now, lastSeen: now,
    heardSpeech: false, transcript: [],
    bestArea: 0, bestFrame: null, bestBox: null,
    countdownEnd: 0, recordingSince: 0
  };
  _state = 'buffer';
  takeBestFrame();
  startListening();
  if (!_tickTimer) _tickTimer = setInterval(tick, 200);
  log('◌ ' + (person ? person.name : 'new face') + ' — buffering (eye contact)');
  render();
}

function tick() {
  if (!_enc) { clearInterval(_tickTimer); _tickTimer = null; return; }
  var now = Date.now();
  var away = now - _enc.lastSeen;

  if (_state === 'buffer') {
    if (away > LEAVE_MS_PENDING) return endEncounter('left');
    var speechOk = _enc.heardSpeech || _speech === 'unavailable';
    if (now - _enc.startedAt >= BUFFER_MS && speechOk) {
      if (_enc.kind === 'new') {
        _state = 'countdown';
        _enc.countdownEnd = now + COUNTDOWN_S * 1000;
        log('◔ new person — countdown (swipe forward to cancel)', true);
      } else {
        startRecording();
      }
    }
  } else if (_state === 'countdown') {
    if (away > LEAVE_MS_PENDING) return endEncounter('left');
    if (now >= _enc.countdownEnd) return confirmNewPerson();
  } else if (_state === 'recording' || _state === 'paused') {
    if (away > LEAVE_MS_RECORD) return endEncounter(_state === 'recording' ? 'finished' : 'left');
  }
  render();
}

function startRecording() {
  _state = 'recording';
  _enc.recordingSince = Date.now();
  log('● recording encounter' + (_enc.person ? ' with ' + _enc.person.name : ''), true);
  render();
}

// Countdown reached 0: save the new person, keep recording
function confirmNewPerson() {
  _state = 'saving';
  render();
  var photo = _enc.bestFrame ? cropFaceCircle(_enc.bestFrame, _enc.bestBox) : captureFacePhoto();
  _enc.torso = _enc.bestFrame ? cropTorso(_enc.bestFrame, _enc.bestBox) : null;
  _enc.clothing = _enc.torso ? describeClothing(_enc.torso) : null;
  createPerson(meanDescriptor(_enc.samples), photo, 'auto', function(p){
    if (!_enc) return;
    if (!p) { log('⚠ could not save the person — encounter dropped', true); return endEncounter('error'); }
    _enc.person = p;
    startRecording();
  });
}

// reason: cancel (swipe forward) | left | finished | error | stop
function endEncounter(reason) {
  var e = _enc;
  if (!e) return;
  _enc = null;
  _state = 'idle';
  clearInterval(_tickTimer); _tickTimer = null;
  stopListening();
  e.bestFrame = null;   // full frame dropped — only the circular face photo is ever kept
  if (reason === 'cancel') {
    _suppressed.push(e.anchor);
    log('✗ cancelled — nothing saved, won\'t ask about this face again (Tap saves it anyway)', true);
    setStatus('s_notrec');
  } else if (reason === 'finished') {
    saveEncounter(e);
  } else if (reason === 'left' && e.kind === 'new' && !e.person) {
    log('✗ left before the countdown ended — nothing saved');
  }
  render();
}

// Double tap while recording: stop and discard this recording. The person stays saved.
function stopRecording() {
  if (_state !== 'recording') return;
  _state = 'paused';
  _enc.transcript = [];
  _enc.recordingSince = 0;
  log('❚❚ recording stopped and discarded — Tap to resume');
  render();
}
function resumeRecording() {
  if (_state !== 'paused') return;
  _enc.transcript = [];
  startRecording();
}

// ── Gestures ──
function gestureTap() {
  if (_previewOpen) { savePreview(); return; }
  if (_state === 'paused') { resumeRecording(); return; }
  if (_state === 'idle') manualCapture();
}
function gestureSwipeForward() {
  if (_previewOpen) { discardPreview(); return; }
  if (_state === 'countdown') { endEncounter('cancel'); return; }
}
function gestureDoubleTap() {   // native "back"
  if (_previewOpen) { discardPreview(); return; }
  if (_state === 'countdown') { endEncounter('cancel'); return; }
  if (_state === 'recording') { stopRecording(); return; }
  if (_state === 'buffer') { endEncounter('stop'); if (_lastMatchDescriptor) _suppressed.push(new Float32Array(_lastMatchDescriptor)); return; }
  dismissHUD();
}

// ── Render HUD + phone panel from state ──
function render() {
  var st = _state, e = _enc;
  var hud = document.getElementById('hud');
  if (camStream) { hud.style.display = 'block'; document.getElementById('hud-idle').style.display = 'none'; }

  // countdown card (new person only)
  var cnt = document.getElementById('hud-count');
  if (st === 'countdown') {
    cnt.className = 'on';
    document.getElementById('hc-num').textContent = Math.max(0, Math.ceil((e.countdownEnd - Date.now()) / 1000));
  } else cnt.className = '';

  // discreet recording circle
  var rec = document.getElementById('hud-rec');
  if (st === 'recording' || (st === 'saving' && e)) { rec.className = 'on'; document.getElementById('hr-txt').textContent = t('rec'); }
  else if (st === 'paused') { rec.className = 'on paused'; document.getElementById('hr-txt').textContent = t('paused'); }
  else rec.className = '';

  // new person while recording: only the circle (no card)
  if (e && e.kind === 'new' && st !== 'buffer') hideHudCard(true);

  // status line
  if (st === 'buffer') setStatus(_speech === 'unavailable' ? 's_buf_face' : (e.heardSpeech ? 's_buf_speech' : 's_buf_wait'));
  else if (st === 'countdown') setStatus('s_confirm');
  else if (st === 'recording') setStatus('s_rec');
  else if (st === 'paused') setStatus('s_paused');

  renderPanel();
  updateBar();
}

// ── Buffer helpers ──
function snapshotFrame() {
  var vid = document.getElementById('vid');
  if (!vid || vid.readyState < 2) return null;
  var cv = document.createElement('canvas');
  cv.width = vid.videoWidth || 640; cv.height = vid.videoHeight || 480;
  cv.getContext('2d').drawImage(vid, 0, 0, cv.width, cv.height);
  return cv;
}
function takeBestFrame() {
  if (!_enc || !_lastFaceBox || _enc.kind === 'known') return;   // only new people need a photo
  var area = _lastFaceBox.w * _lastFaceBox.h;
  if (area <= _enc.bestArea) return;
  var fr = snapshotFrame();
  if (!fr) return;
  _enc.bestArea = area; _enc.bestFrame = fr;
  _enc.bestBox = { x:_lastFaceBox.x, y:_lastFaceBox.y, w:_lastFaceBox.w, h:_lastFaceBox.h };
}
function meanDescriptor(samples) {
  var out = new Array(128).fill(0);
  samples.forEach(function(s){ for (var i = 0; i < 128; i++) out[i] += s[i]; });
  return out.map(function(v){ return v / samples.length; });
}

// ── Speech: listens only while an encounter is open (eye contact) ──
// Transcribes in the language being SPOKEN (phone's language), independent of the UI language.
// Text only — nothing audio is stored.
var _speech = 'idle';   // idle | listening | unavailable
var _rec = null, _wantListen = false;
(function initSpeech(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { _speech = 'unavailable'; return; }
  _rec = new SR();
  _rec.continuous = true;
  _rec.interimResults = false;
  _rec.lang = navigator.language || 'en-US';
  _rec.onspeechstart = function(){ if (_enc) _enc.heardSpeech = true; };
  _rec.onresult = function(ev){
    for (var i = ev.resultIndex; i < ev.results.length; i++) {
      if (!ev.results[i].isFinal) continue;
      var text = ev.results[i][0].transcript.trim();
      if (text) onSpeech(text);
    }
  };
  _rec.onerror = function(ev){
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
      _speech = 'unavailable'; _wantListen = false;
      log('⚠ microphone not allowed — face-only mode', true);
      render();
    }
  };
  _rec.onend = function(){
    if (_speech === 'unavailable') return;
    _speech = 'idle';
    if (_wantListen) setTimeout(function(){ if (_wantListen) startListening(); }, 300);   // continuous mode stops on its own
  };
})();
function startListening() {
  if (!_rec || _speech === 'unavailable') return;
  _wantListen = true;
  if (_speech === 'listening') return;
  try { _rec.start(); _speech = 'listening'; } catch(e) {}
}
function stopListening() {
  _wantListen = false;
  if (_rec && _speech === 'listening') { try { _rec.stop(); } catch(e) {} }
}
function onSpeech(text) {
  if (!_enc) return;
  _enc.heardSpeech = true;
  if (_state === 'paused') return;   // stopped by the user: nothing is kept
  var d = new Date();
  _enc.transcript.push(String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ': ' + text);
  log('“' + text + '”');
}

// ── Persistence (stored text is written in the user's language) ──
function nextUnknownName() {
  var n = 1, re = /^(?:Pessoa Desconhecida|Unknown Person) (\d+)$/;
  _profiles.forEach(function(p){ var m = re.exec(p.name || ''); if (m) n = Math.max(n, parseInt(m[1], 10) + 1); });
  return t('d_unknown', { n: n });
}

function createPerson(emb, photo, mode, cb) {
  if (!emb || !Array.isArray(emb) || emb.length !== 128) { cb(null); return; }
  var name = nextUnknownName();
  var body = {
    name: name, status: 'Identificado', face_embedding: JSON.stringify(emb),
    last_seen_date: new Date().toISOString(),
    last_seen_context: t(mode === 'auto' ? 'd_first_auto' : 'd_first_manual')
  };
  if (photo) body.photo_url = photo;
  fetch(PROXY, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) })
  .then(function(r){ return r.json(); })
  .then(function(p){
    if (!p || !p.id) throw new Error(p && p.error || 'no id');
    _profiles.push(p);
    renderSyncBadge();
    loadEmbeddings();
    log('✓ ' + name + ' saved — complete the details later in the Manager', true);
    cb(p);
  })
  .catch(function(e){ log('⚠ save failed: ' + e.message, true); cb(null); });
}

// Encounter ended naturally: save text only (transcript + 1-line summary + what was seen)
function saveEncounter(e) {
  if (!e.person) return;
  var start = new Date(e.recordingSince || e.startedAt);
  var mins = Math.max(1, Math.round((Date.now() - start.getTime()) / 60000));
  var transcript = e.transcript.join('\n');
  var notes = e.clothing ? t('d_clothing', { c: e.clothing }) : '';
  var p = e.person;
  setStatus('s_saving_enc');
  summarize(transcript, p.name).then(function(summary){
    var context = summary || (t('d_conv', { m: mins }) + (transcript ? '' : t('d_nospeech')));
    return fetch(PROXY + '?entity=FaceContextEncounter', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        person_id: p.id, person_name: p.name, date: start.toISOString(),
        context: context, capture_mode: 'presencial',
        speech_captured: transcript, notes: notes, ocr_captured: ''
      })
    }).then(function(r){ return r.json(); }).then(function(enc){
      fetch(PROXY + '?id=' + p.id + '&entity=FaceContextPerson', {
        method:'PUT', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ last_seen_date: start.toISOString(), last_seen_context: context })
      }).catch(function(){});
      delete _encCache[p.id];
      setStatus('s_enc_saved');
      log('✓ encounter saved — ' + context, true);
      if (e.kind === 'new' && e.torso && enc && enc.id) readBadge(e.torso, enc.id);
    });
  }).catch(function(err){ log('⚠ encounter not saved: ' + err.message, true); setStatus('s_fail'); });
}

// 1-line summary via the existing backend (Gemini, with budget tracking), in the USER's language.
function summarize(transcript, personName) {
  if (!transcript) return Promise.resolve('');
  return fetch(PROXY, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ action:'ai_summary', transcript: transcript, person_name: personName, lang: VC_I18N.lang })
  }).then(function(r){ return r.json(); })
    .then(function(d){ return (d && d.summary) || ''; })
    .catch(function(){ return ''; });
}

// ── Frame crops ──
// Circular 256px face photo — the only image ever stored (spec B5).
function cropFaceCircle(src, b) {
  try {
    if (!src || !b) return null;
    var m = Math.max(b.w, b.h) * 0.25;
    var side = Math.max(b.w, b.h) + m * 2;
    var sx = b.x - (side - b.w) / 2, sy = b.y - (side - b.h) / 2;
    var vw = src.videoWidth || src.width || 640, vh = src.videoHeight || src.height || 480;
    if (sx < 0) sx = 0; if (sy < 0) sy = 0;
    if (sx + side > vw) side = Math.min(side, vw - sx);
    if (sy + side > vh) side = Math.min(side, vh - sy);
    if (side < 10) return null;
    var cv = document.createElement('canvas');
    cv.width = 256; cv.height = 256;
    var ctx = cv.getContext('2d');
    ctx.beginPath(); ctx.arc(128, 128, 128, 0, Math.PI * 2); ctx.clip();
    ctx.drawImage(src, sx, sy, side, side, 0, 0, 256, 256);
    return cv.toDataURL('image/jpeg', 0.8);
  } catch (e) { return null; }
}
function captureFacePhoto() { return cropFaceCircle(document.getElementById('vid'), _lastFaceBox); }

// Chest area right below the face (clothing + badge). Kept in memory only.
function cropTorso(src, b) {
  try {
    if (!src || !b) return null;
    var W = src.width, H = src.height;
    var x0 = Math.max(0, b.x - b.w * 0.8), x1 = Math.min(W, b.x + b.w * 1.8);
    var y0 = Math.max(0, b.y + b.h * 1.15), y1 = Math.min(H, b.y + b.h * 3.2);
    if (x1 - x0 < 20 || y1 - y0 < b.h * 0.5) return null;
    var cv = document.createElement('canvas');
    cv.width = Math.round(x1 - x0); cv.height = Math.round(y1 - y0);
    cv.getContext('2d').drawImage(src, x0, y0, x1 - x0, y1 - y0, 0, 0, cv.width, cv.height);
    return cv;
  } catch (e) { return null; }
}

// Dominant clothing colour — simple estimate, no AI. Returns a colour key (c_*).
function colorName(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  var mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  var s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
  if (l < 0.16) return 'black';
  if (l > 0.86 && s < 0.25) return 'white';
  if (s < 0.16) return 'grey';
  var h = mx === r ? 60 * (((g - b) / d) % 6) : mx === g ? 60 * ((b - r) / d + 2) : 60 * ((r - g) / d + 4);
  if (h < 0) h += 360;
  if (h < 15 || h >= 345) return l < 0.3 ? 'burgundy' : 'red';
  if (h < 40) return l < 0.45 ? 'brown' : 'orange';
  if (h < 65) return l < 0.38 ? 'brown' : (s < 0.4 && l > 0.6 ? 'beige' : 'yellow');
  if (h < 165) return 'green';
  if (h < 255) return l < 0.3 ? 'navy' : 'blue';
  if (h < 290) return 'purple';
  return 'pink';
}
function describeClothing(torso) {
  try {
    var data = torso.getContext('2d').getImageData(0, 0, torso.width, torso.height).data;
    var count = {}, total = 0;
    for (var i = 0; i < data.length; i += 16) {
      var c = colorName(data[i], data[i + 1], data[i + 2]);
      count[c] = (count[c] || 0) + 1; total++;
    }
    if (!total) return null;
    var ranked = Object.keys(count).sort(function(a, b){ return count[b] - count[a]; });
    var top = ranked[0];
    if (count[top] / total < 0.35 && ranked[1]) return t('d_mixed', { a: t('c_' + top), b: t('c_' + ranked[1]) });
    return t('c_' + top);
  } catch (e) { return null; }
}

// Badge OCR — runs after saving, in the background; only stored if readable text is found.
var _tessLoading = null;
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve();
  if (_tessLoading) return _tessLoading;
  _tessLoading = new Promise(function(res, rej){
    var sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    sc.onload = res; sc.onerror = function(){ _tessLoading = null; rej(new Error('OCR unavailable')); };
    document.head.appendChild(sc);
  });
  return _tessLoading;
}
function readBadge(torso, encounterId) {
  var cv = document.createElement('canvas');
  cv.width = torso.width * 2; cv.height = torso.height * 2;
  var ctx = cv.getContext('2d');
  ctx.filter = 'grayscale(1) contrast(1.4)';
  ctx.drawImage(torso, 0, 0, cv.width, cv.height);
  var timeout = new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('timed out')); }, 30000); });
  Promise.race([ loadTesseract().then(function(){ return Tesseract.recognize(cv, 'por+eng'); }), timeout ])
  .then(function(res){
    var words = (res && res.data && res.data.words) || [];
    var txt = words.filter(function(w){ return w.confidence >= 70 && /[A-Za-zÀ-ú]{2,}/.test(w.text); })
      .map(function(w){ return w.text; }).join(' ').trim();
    if (txt.replace(/[^A-Za-zÀ-ú]/g, '').length < 3) { log('◌ badge: no readable text'); return; }
    log('✓ badge: ' + txt, true);
    return fetch(PROXY + '?id=' + encounterId + '&entity=FaceContextEncounter', {
      method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ ocr_captured: txt })
    });
  })
  .catch(function(e){ log('◌ badge not read: ' + e.message); });
}

// ── Face recognition (face-api.js) ──
var _faceApiLoaded = false;
var _descriptors = [];
var _detectTimer = null;

function loadEmbeddings() {
  if (!_faceApiLoaded) return;
  _descriptors = [];
  var bad = 0;
  _profiles.forEach(function(p) {
    if (!p.face_embedding) return;
    try {
      var arr = JSON.parse(p.face_embedding);
      if (Array.isArray(arr) && arr.length === 128) _descriptors.push({ profile: p, descriptor: new Float32Array(arr) });
      else bad++;
    } catch(e) { bad++; }
  });
  log('✓ ' + _descriptors.length + ' recognisable faces' + (bad ? ' (' + bad + ' invalid — re-enrol)' : ''), true);
}

// self-chaining loop: the next detection only runs when the current one finishes
var _detectRunning = false;
function _detectChain() {
  if (!_faceApiLoaded || !camStream || _detectTimer === null) return;
  if (_detectRunning) { _detectTimer = setTimeout(_detectChain, 300); return; }
  _detectRunning = true;
  detectFaces()
    .then(function(){ _detectRunning = false; })
    .catch(function(){ _detectRunning = false; })
    .then(function(){ if (_detectTimer !== null) _detectTimer = setTimeout(_detectChain, 400); });
}
function startFaceDetection() {
  if (!_faceApiLoaded || !camStream) return;
  clearTimeout(_detectTimer);
  _detectTimer = setTimeout(_detectChain, 0);
}
function stopFaceDetection() { clearTimeout(_detectTimer); _detectTimer = null; _detectRunning = false; }

function detectFaces() {
  var vid = document.getElementById('vid');
  var cnv = document.getElementById('cnv');
  if (!vid || vid.readyState < 2 || !camStream) return Promise.resolve();
  cnv.width = vid.videoWidth || 640;
  cnv.height = vid.videoHeight || 480;
  return faceapi.detectAllFaces(vid, new faceapi.TinyFaceDetectorOptions({scoreThreshold:0.4}))
    .withFaceLandmarks(true)
    .withFaceDescriptors()
    .then(function(results) {
      var ctx = cnv.getContext('2d');
      ctx.clearRect(0, 0, cnv.width, cnv.height);
      if (!results || results.length === 0) { noFace(); return; }
      _lastFaceAt = Date.now();
      // the LARGEST face in the frame is the one you are talking to (predictable rule)
      var main = null, mainArea = 0;
      results.forEach(function(r) {
        var box = r.detection.box, area = box.width * box.height;
        if (area > mainArea) { mainArea = area; main = r; }
      });
      results.forEach(function(r) {
        var box = r.detection.box;
        ctx.strokeStyle = (r === main) ? '#00ff88' : 'rgba(0,255,136,.35)';
        ctx.lineWidth = (r === main) ? 1.5 : 1;
        ctx.shadowColor = '#00ff88';
        ctx.shadowBlur = (r === main) ? 4 : 0;
        ctx.strokeRect(box.x, box.y, box.width, box.height);
        ctx.shadowBlur = 0;
      });
      if (main && main.descriptor) {
        var b = main.detection.box;
        _lastFaceBox = { x: b.x, y: b.y, w: b.width, h: b.height };
        handleMatch(main.descriptor);
      }
    })
    .catch(function(e) { log('⚠ detection failed — retrying', true); console.error('detectFaces:', e); });
}

function showProfile(p, score) {

  document.getElementById('hud-ctx').textContent = p.last_seen_context || '';

function hideHudCard(keepProfile) {
  document.getElementById('hud-card').style.display = 'none';
  if (!keepProfile) _currentProfile = null;
}

// Chronological encounter summary (ReadIt/tl;dv style), scrollable in the card.
var _encCache = {};
function loadEncounterSummary(p) {
  var wrap = document.getElementById('hud-sum-wrap');
  var box = document.getElementById('hud-sum');
  if (!wrap || !box || !p.id) return;
  if (_encCache[p.id]) { renderSummary(_encCache[p.id]); return; }
  wrap.style.display = 'block';
  box.textContent = '…';
  fetch(PROXY, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'list',entity:'FaceContextEncounter',limit:200})
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    var list = (Array.isArray(data) ? data : (data.records || []))
      .filter(function(e){ return e.person_id === p.id || e.person_name === p.name; })
      .sort(function(a,b){ return new Date(a.date||0) - new Date(b.date||0); })
      .slice(-4);
    _encCache[p.id] = list;
    renderSummary(list);
  })
  .catch(function(){ wrap.style.display = 'none'; });
}
function renderSummary(list) {
  var wrap = document.getElementById('hud-sum-wrap');
  var box = document.getElementById('hud-sum');
  if (!wrap || !box) return;
  if (!list || !list.length) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  var loc = VC_I18N.locale(), html = '';
  list.forEach(function(e){
    var d = e.date ? new Date(e.date) : null;
    var when = d ? (d.toLocaleDateString(loc,{day:'2-digit',month:'short'}) + ' ' +
                    d.toLocaleTimeString(loc,{hour:'2-digit',minute:'2-digit'})) : '';
    var txt = (e.context || e.notes || '').split('\n')[0];
    if (txt.length > 90) txt = txt.slice(0, 88) + '…';
    html += '<div class="sum-item"><span class="sum-when">' + when + (e.location ? ' · ' + esc(e.location) : '') + '</span>' +
            '<br><span class="sum-txt">' + esc(txt || t('no_summary')) + '</span></div>';
  });
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
}

// ── Camera ──
function toggleCam() { if (camStream) stopCam(); else startCam(); }
function toggleFlipCam() {
  _facingMode = (_facingMode === 'environment') ? 'user' : 'environment';
  log('Switching camera: ' + (_facingMode === 'user' ? 'front' : 'back'));
  if (camStream) {
    camStream.getTracks().forEach(function(tr){ tr.stop(); });

    startCam(true);
  }
}
var _flipBusy = false;
function flipCamTap() {
  if (_flipBusy) return;
  _flipBusy = true;
  toggleFlipCam();
  setTimeout(function(){ _flipBusy = false; }, 800);
}
(function initFlipCamBtn(){
  var b = document.getElementById('flip-cam-btn');
  if (!b) return;
  if (_isTouchDevice) b.classList.add('show');
  var touched = false;
  b.addEventListener('touchstart', function(e){ e.preventDefault(); touched = true; }, {passive:false});

function startCam(auto) {
  var b = document.getElementById('btn-cam');
  b.textContent = '⏳'; b.disabled = true;
  setIdle('idle_req', 'idle_req_sub');
  log('Requesting camera…');
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:_facingMode},width:{ideal:640},height:{ideal:480}},audio:false})
  .then(function(stream) {
    camStream = stream;
    var vid = document.getElementById('vid');
    vid.srcObject = stream;
    vid.onloadedmetadata = function(){ vid.play(); };
    document.getElementById('hud-idle').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    setStatus('s_cam');
    b.textContent = ''; b.disabled = false;

    log('✓ camera on', true);
    startFaceDetection();
  })
  .catch(function(e) {
    log('✗ camera: ' + e.message);
    if (auto) setIdle('idle_blocked', e && e.name === 'NotAllowedError' ? 'idle_blocked_sub' : 'idle_retry_sub');
    else setIdle('idle_fail', 'idle_fail_sub');
    b.textContent = ''; b.disabled = false;
    updateBar();
  });
}

// camera died in the background (app switch / battery saver) → restart when the page comes back
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState !== 'visible' || !camStream) return;
  var dead = camStream.getTracks().length === 0 ||
             camStream.getTracks().every(function(tr){ return tr.readyState === 'ended'; });
  if (dead) { log('camera died in background — restarting…'); camStream = null; startCam(true); }
});

function stopCam() {
  _lastFaceAt = 0;
  if (_enc) endEncounter(_state === 'recording' ? 'finished' : 'stop');
  if (_previewOpen) discardPreview();
  if (camStream) { camStream.getTracks().forEach(function(tr){ tr.stop(); }); camStream = null; }
  document.getElementById('vid').srcObject = null;
  stopFaceDetection();
  clearMatchBox();
  document.getElementById('cnv').getContext('2d').clearRect(0,0,640,480);
  document.getElementById('hud-idle').style.display = 'flex';
  document.getElementById('hud').style.display = 'none';
  updateBar();
  setIdle('idle_stopped', 'idle_stopped_sub');
  log('camera stopped');
}

// ── Touch binding (Android 16/Knox does not propagate 'click' on some elements) ──
function bindTapDyn(el, fn) {
  if (!el) return;
  var touched = false;
  el.addEventListener('touchstart', function(e){ e.preventDefault(); touched=true; el.style.opacity='0.7'; }, {passive:false});
  el.addEventListener('touchend', function(e){ e.preventDefault(); el.style.opacity=''; if(touched){touched=false;fn();} }, {passive:false});
  el.addEventListener('touchcancel', function(){ touched=false; el.style.opacity=''; });
  el.addEventListener('click', function(){ if(!touched) fn(); });
}
function bindBtn(id, fn) { bindTapDyn(document.getElementById(id), fn); }

var script = document.createElement('script');
script.src = 'https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js';
script.onload = function() {
  Promise.all([
    faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model'),
    faceapi.nets.faceLandmark68TinyNet.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model'),
    faceapi.nets.faceRecognitionNet.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model')
  ]).then(function() {
    _faceApiLoaded = true;
    setStatus('s_ready');
    log('✓ AI ready', true);
    loadEmbeddings();
    if (camStream) startFaceDetection();
  }).catch(function(e){ log('⚠ AI: ' + e.message); setStatus('s_ready'); });
};
document.head.appendChild(script);

// ── Init ──
applyLanguage();
setStatus('s_loading');
syncProfiles();
if (_debugMode) setDebug(true);
if (_speech === 'unavailable') log('⚠ no speech recognition in this browser — face-only mode');
log('language: ' + VC_I18N.lang + (VC_I18N.isUserChoice() ? ' (user choice)' : ' (phone: ' + (navigator.language || '?') + ')'));
if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) startCam(true);
else setIdle('idle_nosupport', 'idle_nosupport_sub');
</script>
</body>
</html>
